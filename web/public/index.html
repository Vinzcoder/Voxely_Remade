<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxely Store</title>
<style>
  :root { --bg:#1b2838; --nav:#171a21; --panel:#16202d; --blue:#66c0f4; --text:#c6d4df; --dim:#8f98a0; --green1:#75b022; --green2:#588a1b; }
  * { box-sizing:border-box; margin:0; }
  body { background:linear-gradient(#1b2838,#0f1823 600px) fixed; color:var(--text); font:14px "Motiva Sans",Arial,Helvetica,sans-serif; min-height:100vh; }
  a { color:var(--blue); text-decoration:none; cursor:pointer; }
  header { background:var(--nav); }
  .bar { max-width:940px; margin:0 auto; height:64px; display:flex; align-items:center; gap:28px; padding:0 10px; }
  .logo { font-size:26px; font-weight:700; letter-spacing:3px; color:#fff; }
  .bar nav a { color:#b8b6b4; font-size:14px; font-weight:700; }
  .bar nav a:hover { color:#fff; }
  .me { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .dot { width:28px; height:28px; border-radius:3px; }
  main { max-width:940px; margin:0 auto; padding:20px 10px 60px; }
  h2 { color:#fff; font-size:14px; font-weight:400; text-transform:uppercase; letter-spacing:.04em; margin:26px 0 8px; }
  .art { position:relative; overflow:hidden; background:linear-gradient(135deg,var(--a),var(--b)); }
  .art i { position:absolute; bottom:0; background:rgba(0,0,0,.28); border-top:4px solid rgba(255,255,255,.25); }
  /* featured */
  .feat { display:flex; gap:4px; background:rgba(0,0,0,.25); padding:4px; height:340px; }
  .feat .big { flex:1; cursor:pointer; display:flex; align-items:flex-end; padding:16px; }
  .feat .big h1 { color:#fff; font-size:34px; text-shadow:0 2px 6px #000; }
  .feat .big p { color:#fff; text-shadow:0 1px 4px #000; margin-top:4px; }
  .feat ul { width:220px; list-style:none; padding:0; display:flex; flex-direction:column; gap:4px; }
  .feat li { flex:1; background:rgba(103,193,245,.1); padding:12px; cursor:pointer; display:flex; flex-direction:column; justify-content:center; }
  .feat li:hover, .feat li.on { background:rgba(103,193,245,.3); color:#fff; }
  .feat li small { color:var(--dim); margin-top:2px; }
  /* list */
  .row { display:flex; gap:12px; background:rgba(0,0,0,.2); margin-bottom:4px; cursor:pointer; align-items:center; padding-right:14px; }
  .row:hover { background:rgba(103,193,245,.2); }
  .row .art { width:184px; height:69px; flex:none; }
  .row .t { flex:1; } .row .t b { color:#fff; font-weight:400; font-size:15px; display:block; }
  .row .t small { color:var(--dim); }
  .tag { display:inline-block; background:rgba(103,193,245,.2); color:#67c1f5; padding:1px 7px; border-radius:2px; font-size:12px; margin-right:4px; }
  .price { background:#000; padding:4px 10px; border-radius:2px; color:#beee11; }
  /* game page */
  .crumb { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .gtitle { color:#fff; font-size:26px; margin-bottom:10px; }
  .gmain { display:flex; gap:16px; }
  .gmain .art { width:616px; height:353px; flex:none; }
  .side { flex:1; } .side p { margin-bottom:14px; line-height:1.5; }
  .side dl { color:var(--dim); font-size:12px; margin-bottom:8px; } .side dd { color:var(--text); margin:0 0 6px; }
  .buy { margin-top:22px; background:linear-gradient(90deg,rgba(78,100,128,.4),rgba(40,55,70,.3)); padding:16px; display:flex; align-items:center; justify-content:space-between; }
  .buy h3 { color:#fff; font-size:20px; font-weight:400; }
  .play { background:linear-gradient(90deg,var(--green1),var(--green2)); color:#fff; border:0; padding:10px 28px; border-radius:2px; font-size:16px; cursor:pointer; }
  .play:hover { filter:brightness(1.15); }
  .about { margin-top:20px; background:rgba(0,0,0,.2); padding:16px; line-height:1.6; }
  /* login + modal */
  .veil { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; z-index:9; }
  .veil.on { display:flex; }
  .box { width:360px; background:#1b2838; border:1px solid #2a475e; padding:28px; }
  .box h3 { color:#fff; font-size:20px; margin-bottom:6px; } .box p { color:var(--dim); margin-bottom:16px; line-height:1.4; }
  .box input { width:100%; background:#32363f; border:1px solid #000; color:#fff; padding:10px; margin-bottom:12px; border-radius:2px; }
  .box .play { width:100%; }
  @media (max-width:800px) { .gmain, .feat { flex-direction:column; height:auto; } .gmain .art { width:100%; height:240px; } .feat ul { width:auto; } .feat .big { height:220px; } }
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">VOXELY</div>
  <nav><a href="#/">STORE</a></nav>
  <div class="me" id="me"></div>
</div></header>
<main id="view"></main>

<div class="veil" id="login"><div class="box">
  <h3>Masuk ke Voxely</h3>
  <p>Tidak perlu daftar. Masuk sebagai guest dan langsung pilih game.</p>
  <input id="nick" maxlength="16" placeholder="Nama guest (boleh kosong)">
  <button class="play" id="guestBtn">Lanjut sebagai Guest</button>
</div></div>

<div class="veil" id="launch"><div class="box">
  <h3 id="lTitle">Membuka Voxely Client…</h3>
  <p id="lText">Jika browser bertanya, pilih "Open Voxely Client".</p>
  <button class="play" id="lDl" style="display:none;margin-bottom:8px" onclick="download()">Download Voxely Client</button>
  <button class="play" style="background:#32363f" onclick="document.getElementById('launch').classList.remove('on')">Tutup</button>
</div></div>

<script src="/config.js"></script>
<script>
const S = window.VOXELY.server.replace(/\/$/, '');
const $ = s => document.querySelector(s);
let games = [], session = JSON.parse(localStorage.getItem('voxely') || 'null');

const art = g => {
  let blocks = ''; for (let i = 0; i < 7; i++) blocks += `<i style="left:${i*15-2}%;width:14%;height:${20+((i*37+g.title.length*9)%45)}%"></i>`;
  return `<div class="art" style="--a:${g.art[0]};--b:${g.art[1]}">${blocks}</div>`;
};
const tags = g => g.tags.map(t => `<span class="tag">${t}</span>`).join('');

async function guestLogin() {
  const r = await fetch(S + '/api/guest', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: $('#nick').value }) });
  session = await r.json(); localStorage.setItem('voxely', JSON.stringify(session));
  $('#login').classList.remove('on'); renderMe(); route();
}
function logout() { localStorage.removeItem('voxely'); session = null; renderMe(); $('#login').classList.add('on'); }
function renderMe() {
  $('#me').innerHTML = session ? `<span>${session.user.name}</span><div class="dot" style="background:${session.user.color}"></div><a onclick="logout()">logout</a>` : '';
}

async function loadGames() { games = await (await fetch(S + '/api/games')).json(); }

function home() {
  const f = games[0];
  $('#view').innerHTML = `
    <h2>Featured &amp; Recommended</h2>
    <div class="feat">
      <div class="big art" id="fb" style="--a:${f.art[0]};--b:${f.art[1]}" onclick="location.hash='#/game/${f.id}'"><div><h1>${f.title}</h1><p>${f.tagline}</p></div></div>
      <ul>${games.map((g,i) => `<li class="${i?'':'on'}" onmouseenter="feature(${i})" onclick="location.hash='#/game/${g.id}'">${g.title}<small>${g.online} online</small></li>`).join('')}</ul>
    </div>
    <h2>Browse all games</h2>
    ${games.map(g => `<div class="row" onclick="location.hash='#/game/${g.id}'">${art(g)}<div class="t"><b>${g.title}</b><small>${g.online} players online</small></div><div>${tags(g)}</div><span class="price">Free</span></div>`).join('')}`;
}
function feature(i) {
  const g = games[i], fb = $('#fb'); if (!fb) return;
  fb.style.setProperty('--a', g.art[0]); fb.style.setProperty('--b', g.art[1]);
  fb.setAttribute('onclick', `location.hash='#/game/${g.id}'`);
  fb.querySelector('h1').textContent = g.title; fb.querySelector('p').textContent = g.tagline;
  document.querySelectorAll('.feat li').forEach((li, n) => li.classList.toggle('on', n === i));
}

function gamePage(id) {
  const g = games.find(x => x.id === id); if (!g) return (location.hash = '#/');
  $('#view').innerHTML = `
    <div class="crumb"><a href="#/">All Games</a> &gt; ${g.title}</div>
    <div class="gtitle">${g.title}</div>
    <div class="gmain">${art(g)}
      <div class="side"><p>${g.tagline} ${g.desc}</p>
        <dl><dt>PLAYERS ONLINE</dt><dd>${g.online}</dd><dt>TAGS</dt><dd>${tags(g)}</dd></dl>
      </div>
    </div>
    <div class="buy"><h3>Play ${g.title}</h3><div><span class="price">Free</span> &nbsp; <button class="play" onclick="play('${g.id}')">Play</button></div></div>
    <div class="about"><b style="color:#fff">About this game</b><br>${g.desc}<br><br>
      <span style="color:var(--dim)">Butuh Voxely Client di PC kamu. Belum punya? <a onclick="download()">Download Voxely Client</a>, install, lalu klik Play.</span></div>`;
}

function download() {
  if (!VOXELY.download) return alert('Link download belum diatur (CLIENT_DOWNLOAD_URL di Vercel).');
  location.href = VOXELY.download;
}
function show(title, text, dl) {
  $('#lTitle').textContent = title; $('#lText').textContent = text;
  $('#lDl').style.display = dl ? 'block' : 'none'; $('#launch').classList.add('on');
}
async function play(id) {
  const ok = await fetch(S + '/api/me', { headers: { Authorization: 'Bearer ' + session.token } }).then(r => r.ok).catch(() => false);
  if (!ok) return logout(); // server restarted / session expired: login again
  show('Membuka Voxely Client…', 'Jika browser bertanya, pilih "Open Voxely Client".', false);
  location.href = `voxely://play?game=${id}&token=${session.token}&server=${encodeURIComponent(S)}`;
  setTimeout(() => {
    if (document.hasFocus() && document.visibilityState === 'visible')
      show('Client belum terpasang', 'Download dan install Voxely Client dulu, lalu klik Play lagi.', true);
    else $('#launch').classList.remove('on');
  }, 2500);
}

async function route() {
  if (!session) return $('#login').classList.add('on');
  await loadGames();
  const m = location.hash.match(/^#\/game\/(\w+)/);
  m ? gamePage(m[1]) : home();
}
$('#guestBtn').onclick = guestLogin;
$('#nick').onkeydown = e => e.key === 'Enter' && guestLogin();
window.onhashchange = route;
setInterval(() => session && route(), 8000);
renderMe(); route();
</script>
</body>
</html>
