<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxely</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0906; --panel:#141009; --panel2:#0f0c07;
    --line:#4a3812; --line2:#2a2110;
    --amber:#ffb000; --amber-hi:#ffd23f; --amber-dim:#a87e21;
    --text:#f0dfb2; --dim:#9a8352;
    --green:#5cff8a; --red:#ff6b5c;
  }
  *{ box-sizing:border-box; margin:0; border-radius:0; }
  html{ scrollbar-color:var(--line) var(--bg); }
  body{ background:var(--bg); color:var(--text); font:19px/1.45 'VT323',monospace; min-height:100vh; }
  a{ color:inherit; text-decoration:none; cursor:pointer; }
  button{ font-family:inherit; }
  ::selection{ background:var(--amber); color:#140f05; }
  ::-webkit-scrollbar{ width:12px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:var(--line); border:3px solid var(--bg); }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 16px; }
  canvas{ display:block; }

  /* ===== lapisan CRT ===== */
  #crt{ position:fixed; inset:0; pointer-events:none; z-index:100;
    background:
      radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(0,0,0,.38) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }
  #crt::after{ content:''; position:absolute; left:0; right:0; height:130px; top:-160px;
    background:linear-gradient(transparent, rgba(255,190,80,.032), transparent);
    animation:roll 9s linear infinite;
  }
  @keyframes roll{ to{ transform:translateY(calc(100vh + 340px)); } }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ===== power-on ===== */
  #stage{ animation:crtOn .7s ease-out both; }
  @keyframes crtOn{
    0%{ transform:scale(.05,.004); filter:brightness(7); }
    38%{ transform:scale(1,.004); filter:brightness(7); }
    62%{ transform:scale(1,1); filter:brightness(2.1); }
    100%{ transform:scale(1,1); filter:brightness(1); }
  }

  /* ===== header ===== */
  .top{ background:var(--panel2); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .bar{ height:58px; display:flex; align-items:center; gap:18px; }
  .logo{ font:15px 'Press Start 2P'; color:var(--amber-hi); letter-spacing:2px; text-shadow:0 0 14px rgba(255,176,0,.35); }
  .logo .cur{ color:var(--amber); animation:blink 1.1s steps(1) infinite; }
  .tabs{ display:flex; gap:4px; margin:0 auto; }
  .tabs a{ font:8px 'Press Start 2P'; color:var(--dim); padding:11px 15px; border:1px solid transparent; cursor:pointer; }
  .tabs a:hover{ color:var(--amber-hi); }
  .tabs a.on{ color:var(--amber); border-color:var(--line); background:var(--panel); }
  .user{ position:relative; }
  .user > button{ background:none; border:1px solid var(--line); color:var(--text); font:17px 'VT323';
    padding:5px 12px 5px 6px; cursor:pointer; display:flex; align-items:center; gap:9px; }
  .user > button:hover{ border-color:var(--amber); color:var(--amber-hi); }
  .av{ width:26px; height:26px; border:1px solid var(--line); image-rendering:pixelated; }
  .menu{ position:absolute; right:0; top:40px; width:252px; background:var(--panel);
    border:1px solid var(--amber); box-shadow:7px 7px 0 rgba(0,0,0,.55); display:none; z-index:30; }
  .menu.on{ display:block; }
  .menu .mh{ padding:12px 14px; border-bottom:1px solid var(--line); }
  .menu .mh b{ font:9px 'Press Start 2P'; color:var(--amber-hi); }
  .menu .mh small{ display:block; color:var(--dim); margin-top:5px; font-size:15px; }
  .menu a{ display:block; padding:8px 14px; font-size:17px; cursor:pointer; }
  .menu a::before{ content:'► '; color:var(--amber-dim); }
  .menu a:hover{ background:var(--amber); color:#140f05; }
  .menu a:hover::before{ color:#140f05; }
  .menu .out{ color:var(--red); border-top:1px solid var(--line); }
  .menu .out::before{ content:'■ '; }
  .menu .out:hover{ background:var(--red); color:#140f05; }

  /* ===== ticker ===== */
  .ticker{ background:var(--panel2); border-bottom:1px solid var(--line); overflow:hidden; }
  .tk{ display:flex; width:max-content; animation:tk 30s linear infinite; }
  .ticker:hover .tk{ animation-play-state:paused; }
  .tkh{ display:flex; }
  .tkh span{ padding:5px 2.4em; font-size:16px; color:var(--amber); white-space:nowrap; letter-spacing:1px; }
  @keyframes tk{ to{ transform:translateX(-50%); } }

  /* ===== komponen dasar ===== */
  main{ padding:26px 0 0; }
  .label{ display:inline-block; font:9px 'Press Start 2P'; background:var(--amber); color:#140f05;
    padding:9px 15px; margin-bottom:14px; letter-spacing:1px; }
  .panel{ background:var(--panel); border:1px solid var(--line); }
  .panel h4{ font:8px 'Press Start 2P'; background:var(--amber); color:#140f05; padding:8px 11px;
    letter-spacing:1px; display:flex; justify-content:space-between; gap:10px; }
  .panel h4 span{ opacity:.65; }
  .btn{ font:9px 'Press Start 2P'; background:var(--amber); color:#140f05; border:0; padding:13px 20px;
    cursor:pointer; line-height:1.6; box-shadow:3px 3px 0 rgba(255,176,0,.28); }
  .btn:hover{ background:var(--amber-hi); }
  .btn:active{ transform:translate(2px,2px); box-shadow:none; }
  .btn.alt{ background:transparent; color:var(--amber); border:1px solid var(--line); box-shadow:none; }
  .btn.alt:hover{ background:var(--line2); color:var(--amber-hi); }
  .live{ display:inline-block; width:8px; height:8px; background:var(--green); margin-right:7px;
    animation:blink 1s steps(1) infinite; }
  h3.sec{ margin:36px 0 14px; font:10px 'Press Start 2P'; color:var(--amber); letter-spacing:1px;
    display:flex; align-items:center; gap:12px; }
  h3.sec::after{ content:''; flex:1; height:1px; background:var(--line); }

  /* ===== home: hero + side ===== */
  .cols{ display:grid; grid-template-columns:1fr 300px; gap:16px; }
  .hero{ position:relative; display:grid; grid-template-columns:1.2fr 1fr; height:342px;
    background:var(--panel); border:1px solid var(--line); }
  .hero-art{ position:relative; overflow:hidden; cursor:pointer; }
  .hero-art canvas{ width:100%; height:100%; }
  .hero-idx{ position:absolute; top:10px; left:10px; font:8px 'Press Start 2P'; color:var(--amber);
    background:rgba(10,8,4,.82); border:1px solid var(--line); padding:5px 8px; }
  .arr{ position:absolute; top:50%; transform:translateY(-50%); width:34px; height:52px; z-index:2;
    background:rgba(10,8,4,.85); color:var(--amber); border:1px solid var(--line);
    font:16px 'VT323'; cursor:pointer; }
  .arr:hover{ background:var(--amber); color:#140f05; }
  .hero-info{ padding:20px 22px 16px; border-left:1px solid var(--line); display:flex;
    flex-direction:column; gap:9px; min-width:0; }
  .hero-info h2{ font:13px 'Press Start 2P'; color:var(--amber-hi); line-height:1.55; text-transform:uppercase; }
  .hero-info .tl{ color:var(--dim); font-size:20px; }
  .hero-info .onl{ color:var(--green); }
  .hbtns{ display:flex; gap:10px; }
  .shots-lb{ margin-top:auto; color:var(--amber-dim); font-size:15px; letter-spacing:1px; }
  .shots{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; height:66px; }
  .shots > div{ border:1px solid var(--line2); overflow:hidden; min-height:0; }
  .shots canvas{ width:100%; height:100%; }
  .dots{ display:flex; gap:6px; justify-content:center; margin-top:10px; }
  .dots b{ width:30px; height:9px; background:var(--line2); border:1px solid var(--line); cursor:pointer; }
  .dots b.on{ background:var(--amber); }

  .side{ display:flex; flex-direction:column; gap:16px; min-width:0; }
  .t-in{ display:block; cursor:pointer; }
  .t-in canvas{ width:100%; height:150px; border-bottom:1px solid var(--line2); }
  .t-in:hover canvas{ border-bottom-color:var(--amber); }
  .t-tx{ padding:11px 13px; }
  .t-tx b{ display:block; font:10px 'Press Start 2P'; color:var(--amber-hi); text-transform:uppercase; margin-bottom:7px; line-height:1.5; }
  .t-tx small{ color:var(--dim); font-size:16px; }
  .a-in{ padding:13px; }
  .a-spark svg{ width:100%; height:48px; display:block; }
  .a-big{ margin-top:10px; font:22px 'Press Start 2P'; color:var(--amber-hi); line-height:1; }
  .a-big small{ display:block; font:8px 'Press Start 2P'; color:var(--dim); margin-top:9px; }
  .a-foot{ margin-top:13px; padding-top:11px; border-top:1px dashed var(--line2); color:var(--dim); font-size:16px; }
  .blinkDot{ fill:var(--green); animation:blink 1s steps(1) infinite; }

  /* ===== grid games ===== */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:12px; }
  .gc{ position:relative; display:block; background:var(--panel); border:1px solid var(--line);
    transition:transform .12s, box-shadow .12s, border-color .12s; }
  .gc:hover{ border-color:var(--amber); transform:translate(-3px,-3px); box-shadow:5px 5px 0 rgba(255,176,0,.18); }
  .gc-art{ position:relative; height:132px; border-bottom:1px solid var(--line2); overflow:hidden; }
  .gc-art canvas{ width:100%; height:100%; }
  .gc-n{ position:absolute; top:0; left:0; font:8px 'Press Start 2P'; background:var(--amber);
    color:#140f05; padding:4px 7px; }
  .gc-in{ padding:11px 13px 13px; }
  .gc-in b{ display:block; font:9px 'Press Start 2P'; color:var(--text); text-transform:uppercase;
    line-height:1.6; margin-bottom:7px; min-height:29px; }
  .gc-in small{ color:var(--dim); font-size:16px; }

  /* ===== halaman game ===== */
  .crumb{ color:var(--dim); font-size:17px; margin-bottom:10px; }
  .crumb a{ color:var(--amber); } .crumb a:hover{ color:var(--amber-hi); }
  .gtitle{ font:19px 'Press Start 2P'; color:var(--amber-hi); text-transform:uppercase;
    line-height:1.5; margin-bottom:16px; }
  .gmain{ display:grid; grid-template-columns:1fr 320px; gap:16px; }
  .g-art{ position:relative; height:400px; border:1px solid var(--line); overflow:hidden; }
  .g-art canvas{ width:100%; height:100%; }
  .ovl{ position:absolute; left:10px; bottom:10px; font:8px 'Press Start 2P'; color:var(--green);
    background:rgba(10,8,4,.82); border:1px solid var(--line2); padding:6px 9px; }
  .gi-in{ padding:14px 16px 16px; }
  .gi-in .tl{ color:var(--amber-hi); font-size:21px; margin-bottom:9px; }
  .gi-in .ds{ color:var(--dim); line-height:1.45; }
  .gi-in dt{ font:8px 'Press Start 2P'; color:var(--amber-dim); letter-spacing:1px; margin-top:15px; }
  .gi-in dd{ margin-top:5px; font-size:20px; }
  .gi-in dd.gr{ color:var(--green); }
  .tag{ display:inline-block; border:1px solid var(--line); color:var(--amber);
    padding:1px 9px; font-size:15px; margin:2px 5px 2px 0; }
  .buy{ margin-top:16px; border:1px solid var(--amber); background:#181206; padding:17px 19px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .buy h3{ font:11px 'Press Start 2P'; color:var(--amber-hi); text-transform:uppercase; line-height:1.6; }
  .buy small{ display:block; color:var(--dim); margin-top:7px; font-size:16px; }
  .b-r{ display:flex; align-items:center; gap:14px; }
  .free{ font:9px 'Press Start 2P'; border:1px solid var(--amber); color:var(--amber-hi); padding:9px 13px; }
  .about{ margin-top:16px; }
  .ab-in{ padding:15px 17px 17px; color:#d8c391; line-height:1.5; font-size:18px; }
  .ab-in p + p{ margin-top:10px; }
  .ab-in .dl{ color:var(--amber-hi); border-bottom:1px dashed var(--amber); cursor:pointer; }
  .ab-in .dl:hover{ background:var(--line2); }

  /* ===== veils / modal ===== */
  .veil{ position:fixed; inset:0; background:rgba(5,3,1,.88); display:none; align-items:center;
    justify-content:center; z-index:50; padding:20px; }
  .veil.on{ display:flex; }
  #login{ background:var(--bg); }
  .boot{ width:min(680px,94vw); font:20px 'VT323'; color:var(--amber); line-height:1.55; }
  #bootLines{ min-height:230px; white-space:pre-wrap; }
  #bootLines .ok{ color:var(--green); }
  .boot-in{ display:flex; flex-direction:column; gap:13px; margin-top:16px;
    border-top:1px dashed var(--line); padding-top:18px; }
  .boot-in .lbl{ color:var(--text); letter-spacing:1px; }
  .boot-in .opt{ color:var(--dim); }
  .boot-in .row{ display:flex; align-items:center; gap:11px; border:1px solid var(--line);
    background:var(--panel2); padding:9px 13px; }
  .boot-in .pr{ color:var(--amber-hi); font-size:23px; }
  #nick{ flex:1; background:none; border:0; outline:none; color:var(--amber-hi);
    font:22px 'VT323'; caret-color:var(--amber); min-width:0; }
  #nick::placeholder{ color:var(--amber-dim); opacity:.55; }
  .boot-in .hint{ color:var(--dim); font-size:15px; letter-spacing:1px; }
  .box{ width:min(420px,94vw); background:var(--panel); border:1px solid var(--amber);
    padding:22px; box-shadow:9px 9px 0 rgba(0,0,0,.55); }
  .box h3{ font:10px 'Press Start 2P'; color:var(--amber-hi); line-height:1.7; margin-bottom:13px; }
  .box p{ color:var(--dim); font-size:18px; line-height:1.45; margin-bottom:16px; }
  .box .btn{ width:100%; }
  .box .btn + .btn{ margin-top:9px; }
  .loadbar{ height:16px; border:1px solid var(--line); padding:2px; margin-bottom:16px; }
  .loadbar i{ display:block; height:100%; width:8%; background:var(--amber); animation:load 1.15s steps(7) infinite; }
  @keyframes load{ to{ width:100%; } }

  #toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--amber);
    color:#140f05; font:9px 'Press Start 2P'; padding:13px 19px; display:none; z-index:60;
    box-shadow:5px 5px 0 rgba(0,0,0,.6); }

  footer{ border-top:1px solid var(--line); margin-top:64px; }
  footer .wrap{ padding:17px 16px; display:flex; justify-content:space-between; gap:14px;
    color:var(--dim); font-size:15px; letter-spacing:1px; flex-wrap:wrap; }

  @media (max-width:920px){
    .cols, .gmain{ grid-template-columns:1fr; }
    .hero{ grid-template-columns:1fr; height:auto; }
    .hero-art{ height:220px; }
    .hero-info{ border-left:0; border-top:1px solid var(--line); }
    .g-art{ height:260px; }
  }
  @media (max-width:600px){
    .tabs{ display:none; }
    .bar{ height:54px; }
    .hide-s{ display:none; }
    .b-r{ width:100%; } .b-r .btn{ flex:1; }
  }
  @media (prefers-reduced-motion: reduce){
    #stage, .tk, #crt::after, .loadbar i{ animation:none; }
    #crt::after{ display:none; }
  }
</style>
</head>
<body>
<div id="crt"></div>

<div id="stage">
  <header class="top">
    <div class="wrap bar">
      <a class="logo" href="#/">VOXELY<span class="cur">▊</span></a>
      <nav class="tabs">
        <a class="on" href="#/">GAMES</a>
        <a onclick="soon()">PEOPLE</a>
      </nav>
      <div class="user" id="me"></div>
    </div>
  </header>

  <div class="ticker"><div class="tk" id="tk"></div></div>

  <main><div class="wrap" id="view"></div></main>

  <footer>
    <div class="wrap">
      <span>VOXELY TERMINAL v2.1</span>
      <span class="hide-s">AMBER PHOSPHOR · 60 HZ · SCANLINE OK</span>
      <span>(C) 19XX VOXELY CORP.</span>
    </div>
  </footer>
</div>

<!-- boot / login -->
<div class="veil" id="login">
  <div class="boot">
    <div id="bootLines"></div>
    <div class="boot-in" id="bootInput" hidden>
      <div class="lbl">MASUKKAN NAMA OPERATOR <span class="opt">(BOLEH KOSONG)</span> :</div>
      <div class="row"><span class="pr">&gt;</span><input id="nick" maxlength="16" placeholder="GUEST" autocomplete="off"></div>
      <button class="btn" id="guestBtn">► LANJUT SEBAGAI GUEST</button>
      <small class="hint">TEKAN ENTER UNTUK LANJUT · TANPA DAFTAR, LANGSUNG MAIN</small>
    </div>
  </div>
</div>

<!-- launch -->
<div class="veil" id="launch">
  <div class="box">
    <h3 id="lTitle"></h3>
    <div class="loadbar" id="lSpin"><i></i></div>
    <p id="lText"></p>
    <button class="btn" id="lDl" style="display:none" onclick="download()">DOWNLOAD VOXELY CLIENT</button>
    <button class="btn alt" onclick="closeLaunch()">TUTUP</button>
  </div>
</div>

<div id="toast"></div>

<script src="/config.js"></script>
<script>
/* ============ setup & state ============ */
if(!window.VOXELY || !window.VOXELY.server){
  document.getElementById('view').innerHTML =
    '<div class="panel"><h4>KESALAHAN SISTEM</h4><div class="ab-in"><p>/config.js tidak ditemukan atau VOXELY.server belum diatur.</p></div></div>';
  throw new Error('VOXELY config missing');
}
const S = window.VOXELY.server.replace(/\/+$/, '');
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => (n || 0).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let games = [], session = JSON.parse(localStorage.getItem('voxely') || 'null');
let idx = 0, rot = null, hist = [0,0,0,0,0,0], lastTotal = 0;
let booting = false, skipBoot = false, toastT = null;

const total = () => games.reduce((n, g) => n + g.online, 0);
const topGame = () => games.slice().sort((a, b) => b.online - a.online)[0];

/* ============ util visual: rng, warna, voxel ============ */
function rng(str){
  let h = 2166136261 >>> 0;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
}
function col(hex, f){
  if(!/^#[0-9a-f]{6}$/i.test(hex || '')) hex = '#ffb000';
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${((n>>16&255)*f)|0},${((n>>8&255)*f)|0},${((n&255)*f)|0})`;
}

/* Mesin dunia voxel generatif — tiap game punya pulau voxel unik dari seed id-nya */
function drawVoxel(cv, g, seed = 0, animate = false, dur = 700, N = 9){
  if(!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.max(4, Math.round((cv.clientWidth || 120) * dpr));
  const H = Math.max(4, Math.round((cv.clientHeight || 80) * dpr));
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const R = rng((g.id || g.title) + '#' + seed);
  const MAXH = 3;

  let tw = (W * .92) / N, th = tw * .5, bh = tw * .46;
  const mg = H * .05, need = N * th + bh * (MAXH + 1), avail = H - 2 * mg;
  if(need > avail){ const k = avail / need; tw *= k; th *= k; bh *= k; }
  const oy = mg + MAXH * bh + (avail - need) / 2, ox = W / 2;
  const cA = (g.art && g.art[0]) || '#ffb000', cB = (g.art && g.art[1]) || '#ff5c6c';

  const stars = [];
  for(let i = 0; i < 20; i++) stars.push({ x: R() * W | 0, y: R() * H * .6 | 0, s: (R() > .75 ? 2 : 1) * dpr });

  const items = [];
  for(let i = 0; i < N; i++) for(let j = 0; j < N; j++){
    const d = Math.hypot(i - (N-1)/2, j - (N-1)/2) / ((N-1)/2 || 1);
    let h = Math.round((1 - d) * 2.4 + (R() * 1.7 - .85));
    if(R() < .1) h = 0;
    h = Math.max(0, Math.min(MAXH, h));
    if(!h) continue;
    items.push({ t:'b', s:i+j, cx: ox + (i-j)*tw/2, cy: oy + (i+j)*th/2, h,
                 c: (h >= MAXH && R() < .75) ? cB : cA });
  }
  items.sort((a, b) => a.s - b.s);
  const fc = 2 + (R() * 3 | 0);
  for(let k = 0; k < fc; k++)
    items.push({ t:'f', cx: ox + (R()*1.3 - .65) * N * tw / 2, cy: mg + R() * H * .28,
                 w: tw * (.22 + R() * .18), c: R() < .5 ? cA : cB });

  function prism(cx, by, w, t, sh, hex){
    const hw = w/2, hd = t/2;
    ctx.fillStyle = hex;
    ctx.beginPath(); ctx.moveTo(cx, by); ctx.lineTo(cx+hw, by+hd); ctx.lineTo(cx, by+t); ctx.lineTo(cx-hw, by+hd); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col(hex, .42);
    ctx.beginPath(); ctx.moveTo(cx-hw, by+hd); ctx.lineTo(cx, by+t); ctx.lineTo(cx, by+t+sh); ctx.lineTo(cx-hw, by+hd+sh); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col(hex, .66);
    ctx.beginPath(); ctx.moveTo(cx+hw, by+hd); ctx.lineTo(cx, by+t); ctx.lineTo(cx, by+t+sh); ctx.lineTo(cx+hw, by+hd+sh); ctx.closePath(); ctx.fill();
  }
  function paint(k){
    ctx.fillStyle = '#0c0a06'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,190,80,.33)';
    for(const st of stars) ctx.fillRect(st.x, st.y, st.s, st.s);
    const n = Math.ceil(items.length * k);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(1, dpr * .75);
    for(let m = 0; m < n; m++){
      const it = items[m];
      if(it.t === 'b'){
        const by = it.cy - it.h * bh;
        prism(it.cx, by, tw, th, it.h * bh, it.c);
        for(let l = 1; l < it.h; l++){
          const o = l * bh;
          ctx.beginPath();
          ctx.moveTo(it.cx - tw/2, by + th/2 + o);
          ctx.lineTo(it.cx, by + th + o);
          ctx.lineTo(it.cx + tw/2, by + th/2 + o);
          ctx.stroke();
        }
      } else {
        prism(it.cx, it.cy, it.w, it.w * .5, it.w * .45, it.c);
      }
    }
  }
  cancelAnimationFrame(cv._raf || 0);
  if(!animate){ paint(1); return; }
  const t0 = performance.now();
  (function step(now){
    const t = Math.min(1, (now - t0) / dur), e = t * t * (3 - 2 * t);
    paint(e);
    cv._raf = t < 1 ? requestAnimationFrame(step) : 0;
  })(t0);
}

/* avatar identicon 5x5 dari nama */
function drawAv(cv, name, color){
  const c = cv.getContext('2d'), R = rng('av' + name);
  c.fillStyle = '#0e0b07'; c.fillRect(0, 0, 50, 50);
  c.fillStyle = /^#[0-9a-f]{6}$/i.test(color || '') ? color : '#ffb000';
  for(let x = 0; x < 3; x++) for(let y = 0; y < 5; y++)
    if(R() > .52){ c.fillRect(x*10, y*10, 10, 10); c.fillRect((4-x)*10, y*10, 10, 10); }
}

/* ============ toast ============ */
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => t.style.display = 'none', 1700);
}
function soon(){ toast('SEGERA HADIR'); }

/* ============ sparkline & ticker ============ */
function spark(){
  const w = 150, h = 48, mx = Math.max(1, ...hist);
  const pts = hist.map((v, i) => `${(i/(hist.length-1))*w},${(h-4) - (v/mx)*(h-9)}`).join(' ');
  const ly = (h-4) - (hist[hist.length-1]/mx)*(h-9);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts} ${w},${h} 0,${h}" fill="rgba(92,255,138,.07)"/>
    <polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2"/>
    <rect class="blinkDot" x="${w-4}" y="${ly-2.5}" width="5" height="5"/></svg>`;
}
function buildTicker(){
  const t = topGame();
  const half = [
    'SELAMAT DATANG DI VOXELY',
    `► <b data-t="tot">${fmt(total())}</b> PEMAIN ONLINE`,
    `► <b data-t="act">${games.filter(g => g.online > 0).length}</b> DUNIA AKTIF`,
    t ? `TOP HARI INI: ${esc(t.title.toUpperCase())}` : '',
    'AKSES GRATIS UNTUK SEMUA GAME',
  ].filter(Boolean).map(m => `<span>${m}</span>`).join('');
  $('#tk').innerHTML = `<div class="tkh">${half}</div><div class="tkh">${half}</div>`;
}

/* ============ boot & login ============ */
async function bootSeq(){
  booting = true;
  const box = $('#bootLines'); box.innerHTML = '';
  const rows = [
    ['VOXELY SUPER SYSTEM v2.1'],
    ['(C) 19XX VOXELY CORP.  ·  640K RAM OK'],
    [''],
    ['MENYALA PHOSPHOR', 'OK'],
    ['MEMUAT JARINGAN GAME', 'OK'],
    ['MENGHUBUNGKAN KE SERVER', 'OK'],
    [''],
    ['SIAP.'],
  ];
  for(const [txt, ok] of rows){
    const row = document.createElement('div'); box.appendChild(row);
    for(let i = 1; i <= txt.length; i++){
      row.textContent = txt.slice(0, i);
      if(!skipBoot) await wait(9);
    }
    if(ok){
      if(!skipBoot) await wait(150);
      const s = document.createElement('span');
      s.className = 'ok'; s.textContent = ' ........ [ OK ]';
      row.appendChild(s);
    }
    if(!skipBoot) await wait(85);
  }
  if(!skipBoot) await wait(240);
  booting = false; skipBoot = false;
  $('#bootInput').hidden = false; $('#nick').focus();
}
function openLogin(msg){
  const v = $('#login');
  if(v.classList.contains('on') && booting) return;
  v.classList.add('on');
  if(booting) return;
  if(msg || v.dataset.booted){
    $('#bootLines').innerHTML =
      `<div>VOXELY SUPER SYSTEM v2.1</div><div>&nbsp;</div>` +
      (msg ? `<div class="ok">${esc(msg)}</div><div>&nbsp;</div>` : ``) +
      `<div>SIAP.</div>`;
    $('#bootInput').hidden = false; $('#nick').focus();
  } else {
    v.dataset.booted = '1';
    $('#bootInput').hidden = true;
    bootSeq();
  }
}
async function guestLogin(){
  const btn = $('#guestBtn');
  btn.disabled = true; btn.textContent = 'MENGHUBUNGKAN...';
  try{
    const r = await fetch(S + '/api/guest', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('#nick').value.trim() })
    });
    if(!r.ok) throw 0;
    session = await r.json();
    localStorage.setItem('voxely', JSON.stringify(session));
    $('#login').classList.remove('on');
    renderMe(); route();
  }catch(e){ toast('GAGAL TERHUBUNG KE SERVER'); }
  btn.disabled = false; btn.textContent = '► LANJUT SEBAGAI GUEST';
}
function logout(){
  localStorage.removeItem('voxely'); session = null;
  renderMe();
  openLogin('SESI BERAKHIR. SAMPAI JUMPA, OPERATOR.');
}
function renderMe(){
  const box = $('#me');
  if(!session){ box.innerHTML = ''; return; }
  const u = session.user;
  box.innerHTML = `
    <button onclick="event.stopPropagation();$('#menu').classList.toggle('on')">
      <canvas class="av" id="avCv" width="50" height="50"></canvas>
      <span>${esc(u.name)}</span><span>▼</span>
    </button>
    <div class="menu" id="menu">
      <div class="mh"><b>${esc(u.name)}</b><small>GUEST ACCOUNT</small></div>
      <a onclick="soon()">Profil</a>
      <a onclick="soon()">Notifikasi</a>
      <a onclick="soon()">Teman</a>
      <a onclick="soon()">Pengaturan</a>
      <a onclick="soon()">Developer Portal</a>
      <a class="out" onclick="logout()">Logout</a>
    </div>`;
  drawAv($('#avCv'), u.name, u.color);
}
document.addEventListener('click', e => {
  const m = $('#menu');
  if(m && !e.target.closest('.user')) m.classList.remove('on');
});

/* ============ data ============ */
async function loadGames(){
  games = await (await fetch(S + '/api/games')).json();
  hist.push(total()); hist = hist.slice(-20);
}
function countUp(el, from, to, dur){
  if(from === to){ el.textContent = fmt(to); return; }
  cancelAnimationFrame(el._raf || 0);
  const t0 = performance.now();
  (function st(now){
    const t = Math.min(1, (now - t0) / dur), e = t * (2 - t);
    el.textContent = fmt(Math.round(from + (to - from) * e));
    el._raf = t < 1 ? requestAnimationFrame(st) : 0;
  })(t0);
}
async function refresh(){
  try{ await loadGames(); }catch(e){ return; }
  document.querySelectorAll('[data-o]').forEach(el => {
    const g = games.find(x => x.id === el.dataset.o);
    if(g) el.textContent = fmt(g.online);
  });
  const t = total(), elT = $('#tOnline');
  if(elT) countUp(elT, lastTotal, t, 650);
  lastTotal = t;
  const act = games.filter(g => g.online > 0).length;
  const na = $('#nActive'); if(na) na.textContent = act;
  document.querySelectorAll('[data-t="tot"]').forEach(e => e.textContent = fmt(t));
  document.querySelectorAll('[data-t="act"]').forEach(e => e.textContent = act);
  const sw = $('#sparkWrap'); if(sw) sw.innerHTML = spark();
}

/* ============ carousel ============ */
function drawCar(animate){
  const g = games[idx]; if(!g) return;
  $('#car').innerHTML = `
    <button class="arr" style="left:0" onclick="go(-1)" aria-label="sebelumnya">◄</button>
    <button class="arr" style="right:0" onclick="go(1)" aria-label="berikutnya">►</button>
    <div class="hero-art" onclick="location.hash='#/game/${g.id}'">
      <canvas id="carCv"></canvas>
      <div class="hero-idx">${String(idx+1).padStart(2,'0')} / ${String(games.length).padStart(2,'0')}</div>
    </div>
    <div class="hero-info">
      <h2>${esc(g.title)}</h2>
      <p class="tl">${esc(g.tagline)}</p>
      <p class="onl"><i class="live"></i><span data-o="${g.id}">${fmt(g.online)}</span> PEMAIN ONLINE</p>
      <div class="hbtns">
        <button class="btn" onclick="play('${g.id}')">► PLAY</button>
        <button class="btn alt" onclick="location.hash='#/game/${g.id}'">DETAIL</button>
      </div>
      <div class="shots-lb">PRATINJAU DUNIA — SEED #${(g.id||'x').toString().slice(0,5).toUpperCase()}</div>
      <div class="shots">
        <div><canvas data-shot="1"></canvas></div>
        <div><canvas data-shot="2"></canvas></div>
        <div><canvas data-shot="3"></canvas></div>
      </div>
    </div>`;
  drawVoxel($('#carCv'), g, 0, animate, 750, 12);
  document.querySelectorAll('#car [data-shot]').forEach(cv => drawVoxel(cv, g, +cv.dataset.shot, false, 0, 6));
  $('#dots').innerHTML = games.map((_, i) =>
    `<b class="${i === idx ? 'on' : ''}" onclick="idx=${i};drawCar(true)"></b>`).join('');
}
function go(d){ idx = (idx + d + games.length) % games.length; drawCar(true); }

/* ============ halaman ============ */
function home(){
  const top = topGame();
  $('#view').innerHTML = `
    <span class="label">★ FEATURED &amp; RECOMMENDED ★</span>
    <div class="cols">
      <div>
        <div class="hero" id="car"></div>
        <div class="dots" id="dots"></div>
      </div>
      <aside class="side">
        <section class="panel">
          <h4>TRENDING NOW <span>RANK #1</span></h4>
          <a class="t-in" href="#/game/${top.id}">
            <canvas data-vx="${top.id}" data-n="8"></canvas>
            <div class="t-tx"><b>${esc(top.title)}</b>
              <small>► <span data-o="${top.id}">${fmt(top.online)}</span> PEMAIN ONLINE</small></div>
          </a>
        </section>
        <section class="panel">
          <h4>COMMUNITY <span>LIVE</span></h4>
          <div class="a-in">
            <div class="a-spark" id="sparkWrap">${spark()}</div>
            <div class="a-big"><span id="tOnline">${fmt(total())}</span><small>GAMER ONLINE</small></div>
            <div class="a-foot"><i class="live"></i><span id="nActive">${games.filter(g => g.online > 0).length}</span> DUNIA SEDANG AKTIF</div>
          </div>
        </section>
      </aside>
    </div>
    <h3 class="sec">► GAME LIBRARY</h3>
    <div class="grid">${games.map((g, i) => `
      <a class="gc" href="#/game/${g.id}" data-id="${g.id}">
        <div class="gc-art"><canvas data-vx="${g.id}" data-n="8"></canvas>
          <span class="gc-n">${String(i+1).padStart(2,'0')}</span></div>
        <div class="gc-in"><b>${esc(g.title)}</b>
          <small>► <span data-o="${g.id}">${fmt(g.online)}</span> ONLINE · FREE</small></div>
      </a>`).join('')}
    </div>`;
  document.querySelectorAll('#view canvas[data-vx]').forEach(cv => {
    const g = games.find(x => x.id === cv.dataset.vx);
    drawVoxel(cv, g, 0, false, 0, +cv.dataset.n || 9);
  });
  /* hover kartu → dunia voxel beregenerasi */
  document.querySelectorAll('.gc').forEach(el => {
    const g = games.find(x => x.id === el.dataset.id); let s = 0;
    el.addEventListener('mouseenter', () => {
      const cv = el.querySelector('canvas');
      drawVoxel(cv, g, ++s, false, 0, +cv.dataset.n || 9);
    });
  });
  idx = Math.min(idx, games.length - 1);
  drawCar(true);
  rot = setInterval(() => { if(document.visibilityState === 'visible') go(1); }, 6000);
}

function gamePage(id){
  const g = games.find(x => x.id === id);
  if(!g){ location.hash = '#/'; return; }
  $('#view').innerHTML = `
    <div class="crumb">[ <a href="#/">GAMES</a> ] / ${esc(g.title.toUpperCase())}</div>
    <h1 class="gtitle">${esc(g.title)}</h1>
    <div class="gmain">
      <div class="g-art"><canvas id="bigCv"></canvas>
        <span class="ovl"><i class="live"></i>LIVE WORLD</span></div>
      <div class="panel">
        <h4>INFO GAME <span>REF: ${esc(g.id)}</span></h4>
        <div class="gi-in">
          <p class="tl">${esc(g.tagline)}</p>
          <p class="ds">${esc(g.desc)}</p>
          <dl>
            <dt>PEMAIN ONLINE</dt><dd class="gr"><span data-o="${g.id}">${fmt(g.online)}</span></dd>
            <dt>AKSES</dt><dd class="gr">GRATIS</dd>
            <dt>TAG</dt><dd>${g.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</dd>
          </dl>
        </div>
      </div>
    </div>
    <div class="buy">
      <div><h3>MAIN ${esc(g.title)}</h3><small>AKSES GRATIS · BUTUH VOXELY CLIENT DI PC</small></div>
      <div class="b-r"><span class="free">FREE</span>
        <button class="btn" onclick="play('${g.id}')">► PLAY NOW</button></div>
    </div>
    <section class="panel about">
      <h4>TENTANG GAME INI</h4>
      <div class="ab-in">
        <p>${esc(g.desc)}</p>
        <p>Butuh Voxely Client di PC kamu. Belum punya? <a class="dl" onclick="download()">Download Voxely Client</a>, install, lalu klik Play.</p>
      </div>
    </section>`;
  drawVoxel($('#bigCv'), g, 0, true, 950, 12);
}

/* ============ play / download ============ */
function download(){
  if(!window.VOXELY.download) return toast('LINK DOWNLOAD BELUM DIATUR');
  location.href = window.VOXELY.download;
}
function show(title, text, dl){
  $('#lTitle').textContent = title;
  $('#lText').textContent = text;
  $('#lDl').style.display = dl ? 'block' : 'none';
  $('#lSpin').style.display = dl ? 'none' : 'block';
  $('#launch').classList.add('on');
}
function closeLaunch(){ $('#launch').classList.remove('on'); }
async function play(id){
  if(!session) return openLogin();
  const ok = await fetch(S + '/api/me', { headers: { Authorization: 'Bearer ' + session.token } })
    .then(r => r.ok).catch(() => false);
  if(!ok) return logout();
  show('MEMBUKA VOXELY CLIENT…', 'Jika browser bertanya, pilih "Buka Voxely Client".', false);
  location.href = `voxely://play?game=${id}&token=${session.token}&server=${encodeURIComponent(S)}`;
  setTimeout(() => {
    if(document.hasFocus() && document.visibilityState === 'visible')
      show('CLIENT BELUM TERPASANG', 'Download dan install Voxely Client dulu, lalu klik Play lagi.', true);
    else closeLaunch();
  }, 2500);
}

/* ============ routing ============ */
async function route(){
  clearInterval(rot);
  if(!session) return openLogin();
  if(!games.length){
    try{ await loadGames(); }catch(e){}
    if(!games.length){
      $('#view').innerHTML = `<div class="panel"><h4>KESALAHAN SISTEM</h4>
        <div class="ab-in"><p>Server tidak merespon. Daftar game tidak bisa dimuat.</p>
        <p><button class="btn" onclick="route()">► COBA LAGI</button></p></div></div>`;
      return;
    }
    buildTicker();
  }
  const m = location.hash.match(/^#\/game\/(\w+)/);
  m ? gamePage(m[1]) : home();
}

/* ============ init ============ */
 $('#guestBtn').onclick = guestLogin;
 $('#nick').addEventListener('keydown', e => { if(e.key === 'Enter') guestLogin(); });
 $('#login').addEventListener('click', () => { skipBoot = true; });
window.addEventListener('hashchange', route);
setInterval(() => { if(session && !$('#launch').classList.contains('on')) refresh(); }, 10000);
renderMe();
route();
</script>
