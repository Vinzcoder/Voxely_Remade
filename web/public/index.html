<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxely</title>
<style>
  :root { --bg:#090909; --grid:#171717; --ac:#ff7a1a; --ac2:#e85d04; --cream:#f6ecd9; --ink:#2a1d0f; --mut:#8a7a62; }
  * { box-sizing:border-box; margin:0; }
  body { font:14px/1.4 system-ui,"Segoe UI",Arial,sans-serif; color:#eee; min-height:100vh; background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px, linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px; }
  a { color:var(--ac); cursor:pointer; text-decoration:none; }
  .in { max-width:1180px; margin:auto; padding:0 16px; display:flex; align-items:center; }
  .top { background:linear-gradient(#1d1d1d,#0d0d0d); border-bottom:3px solid var(--ac); }
  .top .in { height:50px; }
  .logo { font-weight:800; font-size:22px; letter-spacing:3px; color:#fff; } .logo b { color:var(--ac); }
  .sub { background:linear-gradient(#262626,#151515); border-bottom:1px solid #000; }
  .sub .in { height:44px; justify-content:center; gap:30px; } .sub a { color:#fff; font-weight:600; } .sub a:hover { color:var(--ac); }
  #me { margin-left:auto; }
  .user { position:relative; display:flex; align-items:center; gap:8px; font-weight:700; color:#fff; cursor:pointer; }
  .av { width:28px; height:28px; border-radius:4px; }
  .menu { display:none; position:absolute; right:0; top:38px; width:220px; background:var(--cream); color:var(--ink); border-radius:4px; box-shadow:0 8px 24px #000c; padding:6px 0; z-index:5; font-weight:400; }
  .menu.on { display:block; }
  .menu .mh { padding:8px 16px 10px; border-bottom:1px solid #d9c9aa; margin-bottom:4px; } .menu small { display:block; color:var(--mut); }
  .menu a { display:block; padding:8px 16px; color:var(--ink); } .menu a:hover { background:#ecdcbc; } .menu a.red { color:#c0392b; }
  main { max-width:1180px; margin:auto; padding:0 16px 60px; }
  .ribbon { display:inline-block; background:linear-gradient(#ff9a4a,var(--ac2)); color:#fff; font-weight:800; text-transform:uppercase; padding:8px 18px; border-radius:3px; box-shadow:0 2px 0 #7a2e00; margin:24px 0 12px; text-shadow:0 1px 1px #0006; }
  .row2 { display:flex; gap:16px; }
  .fwrap { flex:1; position:relative; min-width:0; }
  .fcard { display:flex; background:var(--cream); color:var(--ink); border-radius:3px; overflow:hidden; height:330px; box-shadow:0 4px 16px #000a; }
  .fart { flex:1.15; position:relative; cursor:pointer; }
  .cap { position:absolute; left:0; right:0; bottom:0; padding:50px 18px 16px; background:linear-gradient(transparent,#000b); color:#fff; } .cap h2 { font-size:32px; }
  .finfo { flex:1; padding:16px 18px; display:flex; flex-direction:column; gap:8px; } .finfo h3 { font-size:22px; } .finfo p { color:#5b4a33; font-size:13px; }
  .shots { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:auto; } .shots > div { height:78px; cursor:pointer; border:1px solid #d9c9aa; }
  .arr { position:absolute; top:50%; transform:translateY(-50%); width:34px; height:60px; border:0; background:linear-gradient(#ff9a4a,var(--ac2)); color:#fff; font-size:26px; cursor:pointer; z-index:2; }
  .arr.l { left:-2px; border-radius:0 4px 4px 0; } .arr.r { right:-2px; border-radius:4px 0 0 4px; }
  .dots { display:flex; justify-content:center; gap:8px; margin-top:12px; } .dots i { width:34px; height:7px; border-radius:4px; background:#333; cursor:pointer; } .dots i.on { background:var(--ac); }
  .side { width:250px; flex:none; display:flex; flex-direction:column; gap:14px; }
  .sc { background:var(--cream); color:var(--ink); border-radius:3px; overflow:hidden; box-shadow:0 4px 16px #000a; }
  .sc h4 { background:var(--ac2); color:#fff; font-size:12px; padding:7px 12px; letter-spacing:.04em; }
  .sb { padding:12px; } .sb small, .mut { color:var(--mut); }
  .th { height:150px; cursor:pointer; }
  .act { display:flex; align-items:center; justify-content:space-between; } .big { text-align:right; } .big b { font-size:30px; display:block; line-height:1; } .big small { font-size:10px; letter-spacing:.06em; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#1f9d55; margin-right:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .gc { cursor:pointer; transition:transform .12s; } .gc:hover { transform:translateY(-3px); } .gc .t { height:130px; }
  .art { position:relative; overflow:hidden; width:100%; height:100%; background:linear-gradient(135deg,var(--a),var(--b)); }
  .art i { position:absolute; bottom:0; background:rgba(0,0,0,.28); border-top:4px solid rgba(255,255,255,.25); }
  .tag { display:inline-block; background:#ecdcbc; color:#7a4a12; padding:1px 8px; border-radius:2px; font-size:12px; margin:0 4px 4px 0; }
  .crumb { margin:20px 0 10px; color:#999; font-size:12px; }
  .gp { display:flex; gap:16px; } .gart { flex:1.6; height:360px; border-radius:3px; overflow:hidden; box-shadow:0 4px 16px #000a; } .gi { flex:1; } .gi h2 { font-size:26px; margin-bottom:8px; } .gi p { margin-bottom:12px; color:#5b4a33; }
  .buy { margin-top:16px; background:linear-gradient(90deg,#222,#141414); border-left:4px solid var(--ac); padding:16px; display:flex; align-items:center; justify-content:space-between; } .buy h3 { font-size:20px; }
  .price { background:#000; padding:5px 10px; border-radius:2px; color:var(--ac); font-weight:700; }
  .note { margin-top:12px; color:#aaa; }
  .play { background:linear-gradient(#ff9a4a,var(--ac2)); color:#fff; border:0; padding:10px 30px; border-radius:3px; font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 2px 0 #7a2e00; } .play:hover { filter:brightness(1.12); }
  .veil { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; align-items:center; justify-content:center; z-index:9; } .veil.on { display:flex; }
  .box { width:370px; background:var(--cream); color:var(--ink); border-radius:4px; padding:26px; border-top:5px solid var(--ac); }
  .box h3 { font-size:20px; margin-bottom:6px; } .box p { color:#5b4a33; margin-bottom:16px; }
  .box input { width:100%; padding:10px; margin-bottom:12px; border:1px solid #cdb98f; border-radius:3px; background:#fff; }
  .box .play { width:100%; }
  @media (max-width:860px) { .row2, .gp { flex-direction:column; } .side { width:auto; } .fcard { flex-direction:column; height:auto; } .fart { height:220px; flex:none; } .gart { height:230px; } }
</style>
</head>
<body>
<div class="top"><div class="in"><div class="logo">VOX<b>ELY</b></div><div id="me"></div></div></div>
<div class="sub"><div class="in"><a href="#/">Games</a><a onclick="download()">Download Client</a></div></div>
<main id="view"></main>

<div class="veil" id="login"><div class="box">
  <h3>Masuk ke Voxely</h3>
  <p>Tidak perlu daftar. Masuk sebagai guest dan langsung pilih game.</p>
  <input id="nick" maxlength="16" placeholder="Nama guest (boleh kosong)">
  <button class="play" id="guestBtn">Lanjut sebagai Guest</button>
</div></div>

<div class="veil" id="launch"><div class="box">
  <h3 id="lTitle"></h3><p id="lText"></p>
  <button class="play" id="lDl" style="display:none;margin-bottom:8px" onclick="download()">Download Voxely Client</button>
  <button class="play" style="background:#3a3a3a;box-shadow:none" onclick="document.getElementById('launch').classList.remove('on')">Tutup</button>
</div></div>

<script src="/config.js"></script>
<script>
const S = window.VOXELY.server.replace(/\/$/, '');
const $ = s => document.querySelector(s);
let games = [], hist = [], fi = 0, session = JSON.parse(localStorage.getItem('voxely') || 'null');

const art = g => {
  let b = ''; for (let i = 0; i < 7; i++) b += `<i style="left:${i*15-2}%;width:14%;height:${20+((i*37+g.title.length*9)%45)}%"></i>`;
  return `<div class="art" style="--a:${g.art[0]};--b:${g.art[1]}">${b}</div>`;
};
const tags = g => g.tags.map(t => `<span class="tag">${t}</span>`).join('');
const go = id => (location.hash = '#/game/' + id);

async function guestLogin() {
  const r = await fetch(S + '/api/guest', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: $('#nick').value }) });
  session = await r.json(); localStorage.setItem('voxely', JSON.stringify(session));
  $('#login').classList.remove('on'); renderMe(); route();
}
function logout() { localStorage.removeItem('voxely'); session = null; renderMe(); $('#login').classList.add('on'); }
function renderMe() {
  $('#me').innerHTML = session ? `<div class="user" onclick="event.stopPropagation();$('#menu').classList.toggle('on')"><div class="av" style="background:${session.user.color}"></div>${session.user.name} ▾
    <div class="menu" id="menu"><div class="mh"><b>${session.user.name}</b><small>Guest account</small></div><a onclick="download()">Download Client</a><a class="red" onclick="logout()">Logout</a></div></div>` : '';
}
document.addEventListener('click', () => $('#menu')?.classList.remove('on'));

async function loadGames() {
  games = await (await fetch(S + '/api/games')).json();
  hist.push(games.reduce((n, g) => n + g.online, 0)); if (hist.length > 24) hist.shift();
}
function spark() {
  const h = hist.length > 1 ? hist : [hist[0] || 0, hist[0] || 0], m = Math.max(...h, 1);
  const pts = h.map((v, i) => `${(i * 120 / (h.length - 1)).toFixed(1)},${(38 - v / m * 34).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 120 40" width="120" height="40"><polyline points="${pts}" fill="none" stroke="#1f9d55" stroke-width="2"/></svg>`;
}

function home() {
  const trend = [...games].sort((a, b) => b.online - a.online)[0], total = hist[hist.length - 1] || 0;
  $('#view').innerHTML = `
    <div class="ribbon">Featured &amp; Recommended</div>
    <div class="row2">
      <div class="fwrap"><div class="fcard" id="fc"></div>
        <button class="arr l" onclick="step(-1)">‹</button><button class="arr r" onclick="step(1)">›</button><div class="dots" id="dots"></div></div>
      <div class="side">
        <div class="sc"><h4>TRENDING NOW</h4><div class="th" onclick="go('${trend.id}')">${art(trend)}</div><div class="sb"><b>${trend.title}</b><br><small>${trend.online} online</small></div></div>
        <div class="sc"><h4>COMMUNITY ACTIVITY</h4><div class="sb act">${spark()}<div class="big"><b>${total}</b><small>GAMERS ONLINE</small></div></div><div class="sb" style="padding-top:0"><span class="dot"></span>${total} playing right now</div></div>
      </div>
    </div>
    <div class="ribbon">All Games</div>
    <div class="grid">${games.map(g => `<div class="sc gc" onclick="go('${g.id}')"><div class="t">${art(g)}</div><div class="sb"><b>${g.title}</b> <span class="price" style="float:right">Free</span><br><small>${g.online} online</small><div style="margin-top:6px">${tags(g)}</div></div></div>`).join('')}</div>`;
  feat();
}
function feat() {
  const g = games[fi], others = games.filter((_, i) => i !== fi).slice(0, 4);
  $('#fc').innerHTML = `<div class="fart" onclick="go('${g.id}')">${art(g)}<div class="cap"><h2>${g.title}</h2></div></div>
    <div class="finfo"><h3>${g.title}</h3><div><b style="color:var(--ac2)">Free</b> · <span class="mut">${g.online} online</span></div><div>${tags(g)}</div><p>${g.tagline} ${g.desc}</p>
    <div class="shots">${others.map(o => `<div onclick="go('${o.id}')">${art(o)}</div>`).join('')}</div></div>`;
  $('#dots').innerHTML = games.map((_, i) => `<i class="${i === fi ? 'on' : ''}" onclick="fi=${i};feat()"></i>`).join('');
}
function step(d) { fi = (fi + d + games.length) % games.length; feat(); }
setInterval(() => $('#fc') && step(1), 6000);

function gamePage(id) {
  const g = games.find(x => x.id === id); if (!g) return (location.hash = '#/');
  $('#view').innerHTML = `
    <div class="crumb"><a href="#/">Games</a> › ${g.title}</div>
    <div class="gp"><div class="gart">${art(g)}</div>
      <div class="sc gi"><div class="sb"><h2>${g.title}</h2><p>${g.tagline} ${g.desc}</p><div>${tags(g)}</div><p class="mut" style="margin-top:10px">${g.online} players online</p></div></div></div>
    <div class="buy"><h3>Play ${g.title}</h3><div><span class="price">Free</span> &nbsp; <button class="play" onclick="play('${g.id}')">Play</button></div></div>
    <p class="note">Butuh Voxely Client di PC kamu. Belum punya? <a onclick="download()">Download Voxely Client</a>, install, lalu klik Play.</p>`;
}

function download() {
  if (!VOXELY.download) return alert('Link download belum diatur (CLIENT_DOWNLOAD_URL di Vercel).');
  location.href = VOXELY.download;
}
function show(title, text, dl) {
  $('#lTitle').textContent = title; $('#lText').textContent = text;
  $('#lDl').style.display = dl ? 'block' : 'none'; $('#launch').classList.add('on');
}
async function play(id) {
  const ok = await fetch(S + '/api/me', { headers: { Authorization: 'Bearer ' + session.token } }).then(r => r.ok).catch(() => false);
  if (!ok) return logout();
  show('Membuka Voxely Client…', 'Jika browser bertanya, pilih "Open Voxely Client".', false);
  location.href = `voxely://play?game=${id}&token=${session.token}&server=${encodeURIComponent(S)}`;
  setTimeout(() => {
    if (document.hasFocus() && document.visibilityState === 'visible')
      show('Client belum terpasang', 'Download dan install Voxely Client dulu, lalu klik Play lagi.', true);
    else $('#launch').classList.remove('on');
  }, 2500);
}

async function route() {
  if (!session) return $('#login').classList.add('on');
  await loadGames();
  const m = location.hash.match(/^#\/game\/(\w+)/);
  m ? gamePage(m[1]) : home();
}
$('#guestBtn').onclick = guestLogin;
$('#nick').onkeydown = e => e.key === 'Enter' && guestLogin();
window.onhashchange = route;
setInterval(() => session && route(), 8000);
renderMe(); route();
</script>
</body>
</html>
