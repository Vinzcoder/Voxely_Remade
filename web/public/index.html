<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxely</title>
<script>(function(){try{var t=JSON.parse(localStorage.getItem("voxelyTheme")||"null");if(t&&t.v){var r=document.documentElement;for(var k in t.v)r.style.setProperty(k,t.v[k]);r.style.colorScheme=t.l?"light":"dark";}}catch(e){}})();</script>
<style>
  :root { --bg:#04060b; --panel:#0a0f1a; --panel3:#071127; --input:#050913; --row2:#0d1524; --hover:#101c33; --track:#0b1428; --alt:#1b2a4a; --line:#15233f; --blue:#1463ff; --blue2:#0a3fb8; --blue-hover:#3a82ff; --link:#6fa8ff; --text:#e6edf7; --dim:#7d8aa3; --soft:#b6c2d9; --strong:#ffffff; --on:#ffffff; --notice1:#0f2a5c; --notice2:#0a1c3d; --ease:cubic-bezier(.2,.7,.2,1); }
  * { box-sizing:border-box; margin:0; border-radius:0; }
  html { scroll-behavior:smooth; scrollbar-color:var(--alt) var(--bg); }
  body { background:var(--bg); color:var(--text); font:14px/1.5 Inter,"Segoe UI",system-ui,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(900px 380px at 50% -140px, rgba(20,99,255,.20), transparent 70%); background:radial-gradient(900px 380px at 50% -140px, color-mix(in srgb, var(--blue) 22%, transparent), transparent 70%); }
  ::selection { background:var(--blue); color:var(--on); }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-track { background:var(--bg); } ::-webkit-scrollbar-thumb { background:var(--alt); border:2px solid var(--bg); } ::-webkit-scrollbar-thumb:hover { background:var(--blue2); }
  :focus-visible { outline:2px solid var(--blue-hover); outline-offset:2px; }
  a { color:inherit; text-decoration:none; cursor:pointer; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px; }

  /* ---------- header: one slim, sticky bar ---------- */
  .top { position:sticky; top:0; z-index:20; background:var(--panel3); background:color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .top .wrap { height:60px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:24px; }
  .logo { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:800; letter-spacing:.34em; color:var(--strong); }
  .logo svg { width:26px; height:26px; flex:none; }
  .nav { display:flex; justify-content:center; align-self:stretch; gap:2px; }
  .nav a { display:flex; align-items:center; padding:0 16px; color:var(--dim); font-weight:600; letter-spacing:.02em; transition:color .15s, background .15s, box-shadow .15s; }
  .nav a:hover { color:var(--strong); background:var(--hover); }
  .nav a.on { color:var(--strong); box-shadow:inset 0 -2px 0 var(--blue); }
  .user { position:relative; }
  .user > button { background:none; border:0; color:var(--text); display:flex; align-items:center; gap:9px; font:inherit; font-weight:600; cursor:pointer; padding:6px 8px; transition:background .15s; } .user > button:hover { background:var(--hover); }
  .av { width:28px; height:28px; display:inline-block; border:1px solid var(--line); }
  .menu { display:none; position:absolute; right:0; top:50px; width:240px; background:var(--panel); border:1px solid var(--line); z-index:5; box-shadow:0 24px 50px -16px rgba(0,0,0,.7); }
  .menu.on { display:block; }
  .menu .mh { padding:14px 16px; border-bottom:1px solid var(--line); } .menu .mh small { display:block; color:var(--dim); margin-top:2px; }
  .menu a { display:block; padding:10px 16px; color:var(--soft); transition:background .12s, color .12s; } .menu a:hover { background:var(--hover); color:var(--strong); }
  .menu .out { color:#ff5c6c; border-top:1px solid var(--line); }

  /* ---------- layout ---------- */
  main { flex:1; padding:30px 0 70px; }
  .label { display:inline-flex; align-items:center; gap:12px; background:none; color:var(--strong); font-weight:800; letter-spacing:.16em; padding:0; margin-bottom:18px; font-size:12px; text-transform:uppercase; }
  .label::after { content:""; width:56px; height:1px; background:linear-gradient(90deg, var(--blue), transparent); }
  .cols { display:grid; grid-template-columns:1fr 310px; gap:20px; }
  .card { background:var(--panel); border:1px solid var(--line); box-shadow:0 14px 34px -22px rgba(0,0,0,.65); }
  .card h4 { background:none; color:var(--dim); font-size:11px; font-weight:700; letter-spacing:.16em; padding:13px 16px; border-bottom:1px solid var(--line); }
  .art { position:relative; overflow:hidden; background:linear-gradient(135deg,var(--a),var(--b)); width:100%; height:100%; min-height:60px; }
  .art::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, transparent 55%, rgba(0,0,0,.30)); }
  .art i { position:absolute; bottom:0; background:rgba(0,0,0,.3); border-top:3px solid rgba(255,255,255,.22); transition:transform .5s var(--ease); }
  .art img { transition:transform .5s var(--ease); }

  /* ---------- carousel ---------- */
  .car { position:relative; display:grid; grid-template-columns:1.15fr 1fr; height:380px; background:var(--panel); border:1px solid var(--line); box-shadow:0 24px 50px -28px rgba(0,0,0,.8); }
  .car .l { cursor:pointer; overflow:hidden; } .car .l:hover .art img { transform:scale(1.04); } .car .l:hover .art i { transform:scaleY(1.06); }
  .car .r { padding:26px 28px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .kick { color:var(--link); font-size:11px; font-weight:700; letter-spacing:.2em; }
  .car h2 { font-size:30px; line-height:1.15; color:var(--strong); letter-spacing:-.01em; } .car .meta { color:var(--soft); font-size:14px; }
  .car .chips { margin-top:2px; } .car .onl { color:var(--dim); font-size:13px; }
  .shots { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; flex:1; min-height:0; }
  .shots > div:first-child { grid-column:span 2; } .shots > div { min-height:0; overflow:hidden; }
  .car .btn { margin-top:8px; align-self:flex-start; }
  .arr { position:absolute; top:50%; margin-top:-26px; width:36px; height:52px; background:rgba(4,6,11,.62); color:#fff; border:0; font-size:20px; cursor:pointer; z-index:2; transition:background .15s; }
  .arr:hover { background:var(--blue); }
  .dots { display:flex; justify-content:center; gap:8px; margin:14px 0 0; }
  .dots b { width:28px; height:4px; background:var(--alt); cursor:pointer; transition:background .2s, width .2s; } .dots b:hover { background:var(--blue2); } .dots b.on { background:var(--blue); width:44px; }

  /* ---------- side cards ---------- */
  .side { display:flex; flex-direction:column; gap:20px; }
  .trend a { display:block; position:relative; overflow:hidden; } .trend .art { height:190px; }
  .trend a:hover .art img, .trend a:hover .art i { transform:scale(1.05); }
  .trend .in { position:absolute; left:0; right:0; bottom:0; padding:30px 16px 14px; background:linear-gradient(transparent, rgba(0,0,0,.82)); z-index:1; }
  .trend b { font-size:17px; color:#fff; display:block; } .trend small { color:#c9dcff; }
  .act .in { padding:16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .act svg { width:150px; height:46px; } .act .n { font-size:36px; font-weight:800; color:var(--strong); line-height:1; text-align:right; letter-spacing:-.02em; } .act .n small { display:block; font-size:10px; color:var(--dim); letter-spacing:.14em; font-weight:700; margin-top:4px; }
  .act .foot { padding:0 16px 16px; color:var(--dim); font-size:12px; } .live { display:inline-block; width:8px; height:8px; background:#22c55e; margin-right:7px; box-shadow:0 0 8px #22c55e; }

  /* ---------- game grid ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; }
  .gc { background:var(--panel); border:1px solid var(--line); cursor:pointer; transition:border-color .18s, transform .18s var(--ease), box-shadow .18s; display:block; }
  .gc:hover { border-color:var(--blue); transform:translateY(-3px); box-shadow:0 18px 34px -18px rgba(20,99,255,.55); }
  .gc:hover .art img, .gc:hover .art i { transform:scale(1.06); }
  .gc .art { height:128px; } .gc .in { padding:12px 14px 14px; } .gc b { color:var(--strong); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .gc small { color:var(--dim); display:block; margin-top:2px; }
  h3.sec { display:flex; align-items:center; gap:14px; margin:40px 0 16px; font-size:12px; font-weight:800; letter-spacing:.18em; color:var(--dim); }
  h3.sec::after { content:""; flex:1; height:1px; background:var(--line); }
  .tag { display:inline-block; border:1px solid var(--blue); color:var(--link); background:rgba(20,99,255,.08); padding:1px 9px; font-size:12px; margin:0 4px 4px 0; }

  /* ---------- game page ---------- */
  .crumb { color:var(--dim); font-size:12px; margin-bottom:10px; letter-spacing:.02em; } .crumb a:hover { color:var(--strong); }
  .gtitle { font-size:32px; color:var(--strong); margin-bottom:16px; letter-spacing:-.01em; line-height:1.15; }
  .gmain { display:grid; grid-template-columns:1fr 330px; gap:20px; } .gmain .art { height:390px; }
  .info { padding:20px; line-height:1.6; } .info dt { color:var(--dim); font-size:11px; font-weight:700; letter-spacing:.14em; margin-top:16px; } .info dd { margin:3px 0 0; color:var(--text); }
  .buy { margin-top:20px; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .buy h3 { font-size:20px; color:var(--strong); font-weight:700; }
  .btn { display:inline-block; background:var(--blue); color:var(--on); border:1px solid rgba(255,255,255,.12); padding:11px 30px; font-family:inherit; font-size:14px; font-weight:600; letter-spacing:.01em; cursor:pointer; transition:background .15s, transform .15s var(--ease), box-shadow .15s; box-shadow:0 10px 22px -14px var(--blue); }
  .btn:hover { background:var(--blue-hover); transform:translateY(-1px); box-shadow:0 14px 26px -12px var(--blue-hover); } .btn:active { transform:none; }
  .btn.alt { color:var(--strong); background:var(--alt); border-color:var(--line); box-shadow:none; } .btn.alt:hover { background:var(--hover); border-color:var(--blue2); box-shadow:none; }
  .btn:disabled { opacity:.45; cursor:default; transform:none; box-shadow:none; }
  .about { margin-top:20px; padding:20px; line-height:1.65; color:var(--soft); } .about a { color:var(--link); } .about a:hover { text-decoration:underline; }
  .free { border:1px solid var(--line); padding:7px 14px; color:var(--link); margin-right:10px; font-weight:600; }

  /* ---------- modals & toast ---------- */
  .veil { position:fixed; inset:0; background:rgba(0,0,0,.78); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:30; padding:16px; } .veil.on { display:flex; }
  .box { width:380px; max-width:100%; background:var(--panel); border:1px solid var(--blue); padding:30px; box-shadow:0 40px 80px -20px rgba(0,0,0,.85); animation:pop .22s var(--ease); }
  @keyframes pop { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
  .box .bm { display:flex; align-items:center; gap:10px; margin-bottom:18px; font-weight:800; letter-spacing:.3em; font-size:13px; color:var(--strong); } .box .bm svg { width:24px; height:24px; }
  .box h3 { color:var(--strong); font-size:21px; margin-bottom:6px; } .box p { color:var(--dim); margin-bottom:18px; line-height:1.5; }
  .box input { width:100%; background:var(--input); border:1px solid var(--line); color:var(--strong); padding:12px; margin-bottom:12px; font:inherit; } .box .btn { width:100%; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--blue); color:var(--on); padding:11px 20px; display:none; z-index:40; font-weight:600; box-shadow:0 18px 40px -12px rgba(0,0,0,.7); }

  /* ---------- forms ---------- */
  .pad { padding:20px; } .pad label { display:block; color:var(--dim); font-size:12px; margin:14px 0 5px; letter-spacing:.02em; }
  .pad input:not([type=color]):not([type=range]):not([type=checkbox]), .pad textarea, .search, select { width:100%; background:var(--input); border:1px solid var(--line); color:var(--strong); padding:10px 12px; font:inherit; transition:border-color .15s, box-shadow .15s; }
  .pad input:focus, .pad textarea:focus, .search:focus, select:focus, .box input:focus, .rform textarea:focus { outline:0; border-color:var(--blue); box-shadow:0 0 0 3px rgba(20,99,255,.22); box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 26%, transparent); }
  .pad textarea { height:76px; resize:vertical; } .pad input[type=color] { width:100%; height:38px; background:var(--input); border:1px solid var(--line); padding:2px; cursor:pointer; }
  .pad .btn { margin-top:8px; } .ft { color:var(--strong); font-size:18px; }
  .row3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .brow { display:grid; grid-template-columns:repeat(6,1fr) 44px 34px; gap:6px; align-items:end; margin-bottom:6px; }
  .brow label { margin:0; font-size:11px; } .brow input[type=color] { height:34px; }
  .x { background:var(--alt); color:var(--strong); border:0; cursor:pointer; padding:7px 12px; font-family:inherit; transition:background .15s; } .x:hover { background:#c0392b; }
  #pv { width:100%; margin:14px 0 8px; border:1px solid var(--line); display:block; }
  .mrow { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; } .mrow a { flex:1; color:var(--link); } .mrow a:hover { color:var(--strong); } .mrow small { color:var(--dim); }
  .empty { padding:20px; color:var(--dim); } .search { margin-bottom:16px; max-width:420px; }
  .pc { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); padding:12px 14px; transition:border-color .15s, background .15s; } .pc:hover { background:var(--hover); } .pc small { display:block; color:var(--dim); margin-top:2px; } .av2 { width:40px; height:40px; flex:none; }
  .art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; } img.av { object-fit:cover; }
  .prow { display:flex; gap:16px; align-items:center; margin-bottom:6px; }
  .trow { display:flex; gap:12px; align-items:center; }
  .tprev { width:160px; height:90px; background:var(--input); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--dim); overflow:hidden; } .tprev img { width:100%; height:100%; object-fit:cover; }
  .ic { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; vertical-align:middle; }
  a.btn { display:inline-block; text-align:center; } .btn.sm { padding:7px 16px; font-size:13px; }

  /* ---------- forum ---------- */
  .ftitle { font-size:30px; color:var(--strong); margin-bottom:10px; letter-spacing:-.01em; }
  .fnav { display:flex; gap:22px; margin-bottom:16px; } .fnav a { color:var(--link); } .fnav a:hover { color:var(--strong); }
  .ftable { border:1px solid var(--line); background:var(--panel); }
  .fh { display:grid; grid-template-columns:1fr 110px 110px; background:var(--panel3); color:var(--dim); font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:12px 16px; border-bottom:1px solid var(--line); } .fh span:not(:first-child) { text-align:center; }
  .fr { display:grid; grid-template-columns:1fr 110px 110px; align-items:center; padding:16px; border-top:1px solid var(--line); color:var(--text); transition:background .12s; }
  .fh + .fr, .ftable > .fh + * { border-top:0; }
  .ftable .fr:nth-child(even) { background:var(--row2); } a.fr:hover { background:var(--hover) !important; } .fr > span { text-align:center; font-weight:600; }
  .fc { display:flex; gap:14px; align-items:center; } .fc b { color:var(--link); font-size:16px; display:block; } .fc small { color:var(--dim); }
  .fstat { margin-top:20px; } .fstat div { margin-top:8px; color:var(--dim); } .fstat b { color:var(--strong); }
  .tt .fh, .tt .fr { grid-template-columns:150px 1fr; } .au { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
  .tl { color:var(--link); font-weight:600; font-size:16px; display:block; margin-bottom:4px; } .tl:hover { color:var(--strong); } .tt small { display:block; color:var(--dim); }
  .fhead { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .post { display:grid; grid-template-columns:140px 1fr; gap:16px; background:var(--panel); border:1px solid var(--line); padding:16px; margin-bottom:10px; }
  .pa { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; word-break:break-word; } .pb small { color:var(--dim); }
  .ptext { white-space:pre-wrap; margin:6px 0 12px; line-height:1.6; word-break:break-word; }
  .fsearch { display:flex; gap:10px; margin-bottom:16px; } .fsearch .search { margin:0; max-width:420px; } .fsearch .btn { padding:9px 24px; }
  .notice { background:linear-gradient(var(--notice1),var(--notice2)); border:1px solid var(--blue); padding:26px; text-align:center; color:var(--soft); margin-bottom:16px; } .notice small { display:block; margin-top:8px; color:var(--soft); }
  .sortbar { margin:18px 0; display:flex; gap:8px; align-items:center; color:var(--dim); }

  /* ---------- reviews ---------- */
  .rv { display:grid; grid-template-columns:70px 1fr; background:var(--panel); border:1px solid var(--line); padding:18px; margin-bottom:12px; position:relative; }
  .rvh span { color:var(--dim); } .rec { display:inline-flex; align-items:center; gap:10px; background:var(--blue); color:var(--on); padding:8px 14px; margin:8px 0; } .rec.neg { background:#8c2331; }
  .rec b { display:block; } .rec small { font-size:12px; opacity:.9; } .rec .ic { width:26px; height:26px; }
  .rvr p { white-space:pre-wrap; margin:6px 0 14px; word-break:break-word; line-height:1.55; }
  .rvf { border-top:1px solid var(--line); padding-top:12px; color:var(--dim); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .vb { background:none; border:1px solid var(--blue); color:var(--link); padding:5px 14px; cursor:pointer; font:inherit; transition:background .15s, color .15s; } .vb:hover { background:rgba(20,99,255,.14); } .vb.on { background:var(--blue); color:var(--on); } .vb:disabled { opacity:.4; cursor:default; }
  .flag { position:absolute; right:14px; top:14px; background:none; border:0; color:var(--dim); cursor:pointer; } .flag:hover { color:var(--strong); }
  .rform { background:var(--panel); border:1px solid var(--line); padding:18px; margin-bottom:12px; } .rform textarea { width:100%; height:96px; background:var(--input); border:1px solid var(--line); color:var(--strong); padding:10px; font:inherit; margin:12px 0; }
  .rform .tg { display:flex; gap:8px; } .rform .vb { padding:8px 16px; }
  .bdg { background:#ef4444; color:#fff; font-size:11px; padding:1px 6px; margin-left:6px; } .bdg:empty { display:none; }
  a.pc:hover { border-color:var(--blue); } .prof { display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
  .nr { display:flex; align-items:center; gap:14px; padding:16px; border-bottom:1px solid var(--line); } .nt { flex:1; } .nt small { color:var(--dim); } .nt a { color:var(--link); }

  /* ---------- editor ---------- */
  .step .ft { display:flex; align-items:center; gap:10px; margin-bottom:12px; } .sn { background:var(--blue); color:var(--on); width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; font-style:normal; font-size:14px; }
  .hint { background:var(--panel3); border:1px solid var(--line); padding:12px 14px; color:var(--soft); margin:10px 0; line-height:1.55; } .err { color:#ff5c6c; margin-bottom:8px; }
  .tpl { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0; color:var(--dim); } .tools { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  #cv { width:100%; border:1px solid var(--line); touch-action:none; cursor:crosshair; display:block; }
  .selp { margin-top:14px; padding:14px; border:1px solid var(--line); background:var(--input); } .row2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  .pad input[type=range] { background:none; border:0; padding:0; accent-color:var(--blue); width:100%; }
  .sw { display:flex; gap:6px; flex-wrap:wrap; align-items:center; } .swb { width:26px; height:26px; border:2px solid transparent; cursor:pointer; transition:transform .12s; } .swb:hover { transform:scale(1.12); } .swb.on { border-color:var(--strong); }
  .pad .chk { display:flex; gap:8px; align-items:center; margin-top:12px; color:var(--text); font-size:13px; } .pad .chk input[type=checkbox] { width:auto; padding:0; accent-color:var(--blue); }
  .acts { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }

  /* ---------- marketplace ---------- */
  .market-head { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .market-head p { color:var(--soft); max-width:620px; line-height:1.55; margin-top:6px; }
  .market-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .market-card { background:var(--panel); border:1px solid var(--line); padding:14px; transition:border-color .18s, transform .18s var(--ease), box-shadow .18s; }
  .market-card:hover { border-color:var(--blue); transform:translateY(-3px); box-shadow:0 18px 34px -18px rgba(20,99,255,.55); }
  .market-card .market-art { height:156px; background:linear-gradient(135deg,var(--panel3),var(--row2)); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .market-art canvas { height:140px; width:112px; image-rendering:auto; }
  .market-card h3 { color:var(--strong); margin:14px 0 4px; }
  .market-card p { color:var(--dim); min-height:36px; font-size:12px; line-height:1.45; }
  .market-meta { display:flex; justify-content:space-between; align-items:center; margin-top:12px; color:var(--link); font-size:12px; font-weight:600; letter-spacing:.06em; }
  .owned { color:#22c55e; font-weight:700; }
  .market-card .btn { width:100%; margin-top:12px; }
  .market-filter { display:flex; gap:8px; flex-wrap:wrap; }
  .gbtn { background:#fff !important; color:#222 !important; display:flex; align-items:center; justify-content:center; gap:10px; font-weight:600; } .gbtn:hover { background:#e8e8e8 !important; }
  .or { color:var(--dim); text-align:center; font-size:12px; margin:16px 0 12px; }
  .srv { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 18px; border-bottom:1px solid var(--line); } .srv.last { border-bottom:0; }
  .sinfo { flex:1; min-width:0; } .sinfo b { color:var(--strong); } .sinfo small { display:block; color:var(--dim); margin-top:2px; }
  .sbar { height:5px; background:var(--track); margin:8px 0 4px; max-width:260px; } .sbar i { display:block; height:100%; background:var(--blue); }
  .thmgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-top:14px; }
  .thm { background:var(--panel3); border:2px solid var(--line); padding:14px; text-align:left; color:var(--text); cursor:pointer; font:inherit; transition:border-color .15s, transform .15s var(--ease); } .thm:hover { transform:translateY(-2px); border-color:var(--blue2); } .thm.on { border-color:var(--blue); }
  .thm b { display:block; margin:10px 0 2px; color:var(--strong); } .thm small { color:var(--dim); } .sw3 { display:flex; } .sw3 i { width:36px; height:36px; border:1px solid var(--line); margin-right:-1px; }

  /* ---------- badges, avatar, stats ---------- */
  .badge-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .badge-item { background:var(--panel3); border:1px solid var(--line); padding:12px; text-align:center; cursor:default; transition:transform .15s var(--ease); } .badge-item:hover { transform:translateY(-2px); }
  .badge-icon { font-size:24px; display:block; margin-bottom:4px; }
  .badge-name { font-size:11px; color:var(--strong); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge-form { background:var(--panel); border:1px solid var(--line); padding:16px; margin-bottom:10px; }
  .badge-form input, .badge-form textarea { width:100%; margin-bottom:10px; }
  .badge-form textarea { height:60px; }
  .avgrid { display:grid; grid-template-columns:360px 1fr; gap:20px; } .avprev #avc { width:100%; display:block; background:var(--panel3); border:1px solid var(--line); margin-bottom:12px; }
  .av3d { position:relative; aspect-ratio:4 / 5; background:radial-gradient(ellipse at 50% 38%, var(--hover), var(--panel3) 72%); border:1px solid var(--line); margin-bottom:12px; touch-action:none; cursor:grab; overflow:hidden; user-select:none; -webkit-user-select:none; }
  .av3d.drag { cursor:grabbing; } .av3d canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .av3-load { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; letter-spacing:.04em; }
  .av3-hint { position:absolute; left:0; right:0; bottom:10px; text-align:center; color:var(--dim); font-size:11px; letter-spacing:.1em; pointer-events:none; opacity:.8; }
  .av3-tools { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; }
  .avtabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; } .avpal { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px; }
  .avpal .swb { width:34px; height:34px; }
  .verified { width:18px; height:18px; vertical-align:-3px; margin-left:4px; } .follow-stat { color:var(--dim); margin-top:6px; } .follow-stat b { color:var(--strong); }
  .shirt-upload { margin-top:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .avpal input[type=color] { width:46px; height:34px; padding:2px; }
  .avtiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; }
  .tile { background:var(--panel3); border:2px solid var(--line); padding:6px; cursor:pointer; color:var(--text); font:inherit; transition:border-color .15s, transform .15s var(--ease); } .tile:hover { transform:translateY(-2px); border-color:var(--blue2); } .tile.on { border-color:var(--blue); } .tile canvas { width:100%; display:block; } .tile small { display:block; margin-top:4px; color:var(--dim); }
  #uav { background:var(--panel3); border:1px solid var(--line); }
  .stgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; } .stc { background:var(--panel); border:1px solid var(--line); padding:18px; } .stc b { display:block; font-size:28px; color:var(--strong); letter-spacing:-.01em; } .stc small { color:var(--dim); }
  .chart { display:flex; align-items:flex-end; gap:6px; height:180px; margin-top:12px; } .cb { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; font-size:11px; color:var(--dim); } .cb i { display:block; width:100%; background:var(--blue); min-height:2px; }
  .mgh { display:flex; gap:22px; align-items:center; flex-wrap:wrap; } .mga { width:260px; height:146px; flex:none; position:relative; } .gc.dv .acts { margin-top:10px; } .sep2 { border-top:1px solid var(--line); margin:18px 0; }
  .empty-home { text-align:center; padding:70px 20px; } .empty-home h2 { color:var(--strong); font-size:24px; margin-bottom:8px; } .empty-home p { color:var(--dim); margin-bottom:20px; }

  /* ---------- footer ---------- */
  .site-foot { border-top:1px solid var(--line); background:var(--panel3); background:color-mix(in srgb, var(--bg) 70%, transparent); }
  .site-foot .wrap { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; padding-top:22px; padding-bottom:22px; color:var(--dim); font-size:12px; }
  .site-foot b { color:var(--strong); letter-spacing:.3em; margin-right:12px; } .site-foot nav { display:flex; gap:18px; } .site-foot nav a:hover { color:var(--strong); }

  @media (max-width:860px) {
    .top .wrap { height:auto; grid-template-columns:1fr auto; gap:0 12px; padding-top:10px; }
    .nav { grid-column:1 / -1; grid-row:2; justify-content:flex-start; overflow-x:auto; margin:0 -20px; padding:0 12px; height:44px; }
    .nav a { white-space:nowrap; }
    .menu { top:44px; }
    .cols, .gmain, .car, .avgrid { grid-template-columns:1fr; } .car { height:auto; } .car .l { height:210px; } .car .r { padding:20px; } .gmain .art { height:240px; }
    .brow { grid-template-columns:repeat(3,1fr) 44px 34px; } .post { grid-template-columns:1fr; } .rv { grid-template-columns:50px 1fr; } .row2, .row3 { grid-template-columns:1fr; }
    .fh, .fr { grid-template-columns:1fr 70px 70px; } main { padding-top:22px; }
  }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#/"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb0ff"/><stop offset="1" stop-color="#3a82ff"/></linearGradient><linearGradient id="ll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1463ff"/><stop offset="1" stop-color="#0a3fb8"/></linearGradient><linearGradient id="lr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d4fd6"/><stop offset="1" stop-color="#062a7a"/></linearGradient></defs><polygon points="32,5 57,19 32,33 7,19" fill="url(#lt)"/><polygon points="7,19 32,33 32,60 7,46" fill="url(#ll)"/><polygon points="57,19 32,33 32,60 57,46" fill="url(#lr)"/></svg>VOXELY</a>
  <nav class="nav"><a id="nGames" href="#/">Games</a><a id="nPeople" href="#/people">People</a><a id="nForum" href="#/forum">Forum</a><a id="nAvatar" href="#/avatar">Avatar</a><a id="nMarket" href="#/marketplace">Marketplace</a></nav>
  <div class="user" id="me"></div>
</div></header>
<main><div class="wrap" id="view"></div></main>
<footer class="site-foot"><div class="wrap"><div><b>VOXELY</b>© <span id="yr"></span> Voxely. Dibuat untuk para pembuat game.</div><nav><a href="#/">Games</a><a href="#/forum">Forum</a><a href="#/marketplace">Marketplace</a><a href="#/dev">Developer Portal</a></nav></div></footer>

<div class="veil" id="login"><div class="box">
  <div class="bm"><svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,5 57,19 32,33 7,19" fill="#5f9bff"/><polygon points="7,19 32,33 32,60 7,46" fill="#1463ff"/><polygon points="57,19 32,33 32,60 57,46" fill="#0a3fb8"/></svg>VOXELY</div>
  <h3>Masuk ke Voxely</h3>
  <p>Masuk dengan Google, atau langsung main sebagai guest tanpa daftar.</p>
  <button class="btn gbtn" id="googleBtn"><svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Lanjut dengan Google</button><div class="or">atau sebagai guest</div>
  <input id="nick" maxlength="16" placeholder="Nama kamu (boleh kosong = acak)"><div id="loginErr" style="color:#ff5c6c;margin-bottom:10px"></div>
  <button class="btn" id="guestBtn">Lanjut sebagai Guest</button>
</div></div>
<div class="veil" id="launch"><div class="box">
  <h3 id="lTitle"></h3><p id="lText"></p>
  <button class="btn" id="lDl" style="display:none;margin-bottom:8px" onclick="download()">Download Voxely Client</button>
  <button class="btn alt" onclick="document.getElementById('launch').classList.remove('on')">Tutup</button>
</div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
const S = window.VOXELY.server.replace(/\/$/, '');
const mobileGame = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
const sb = window.supabase && VOXELY.supabaseUrl ? supabase.createClient(VOXELY.supabaseUrl, VOXELY.supabaseKey, { auth: { flowType: 'pkce' } }) : null;
const $ = s => document.querySelector(s);
let games = [], session = JSON.parse(localStorage.getItem('voxely') || 'null'), idx = 0, timer = null, hist = [0, 0, 0, 0, 0, 0];

const art = (g, seed = 0) => {
  let b = ''; for (let i = 0; i < 8; i++) b += `<i style="left:${i*13-2}%;width:12%;height:${18+((i*37+seed*23+g.title.length*9)%50)}%"></i>`;
  return `<div class="art" style="--a:${g.art[0]};--b:${g.art[1]}">${g.thumb ? `<img src="${S}/api/thumb/${g.id}?v=${g.thumb}" alt="">` : b}</div>`;
};
const E = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const tags = g => g.tags.map(t => `<span class="tag">${E(t)}</span>`).join('');
const total = () => games.reduce((n, g) => n + g.online, 0);
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => (t.style.display = 'none'), 1800); }
function soon() { toast('Segera hadir'); }
function verifiedBadge(u) { return Number(u?.followers || 0) >= 1000 ? '<img class="verified" src="/assets/images/checkmark.svg" alt="Verified" title="Verified creator · 1,000+ followers">' : ''; }
function avatar(u, n) {
  const st = `width:${n}px;height:${n}px;flex:none`;
  return u.av ? `<img class="av" style="${st}" src="${S}/api/avatar/${u.uid}?v=${u.av}" alt="">` : `<span class="av" style="${st};background:${u.color}"></span>`;
}
function pickImage(w, h, cb) { // choose a file, crop to w x h, return a small JPEG data URL
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg,image/webp';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const k = Math.max(w / img.width, h / img.height), dw = img.width * k, dh = img.height * k;
      c.getContext('2d').drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
      URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => alert('File bukan gambar yang valid');
    img.src = url;
  };
  inp.click();
}

async function guestLogin() {
  const r = await fetch(S + '/api/guest', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: $('#nick').value }) });
  const d = await r.json().catch(() => ({})); if (!r.ok) return ($('#loginErr').textContent = d.error || 'Gagal login'); $('#loginErr').textContent = ''; session = d; localStorage.setItem('voxely', JSON.stringify(session));
  $('#login').classList.remove('on'); renderMe(); route(); syncOutfit();
}
function logout(manual) { localStorage.removeItem('voxely'); session = null; renderMe(); if (manual && sb) sb.auth.signOut(); $('#login').classList.add('on'); }
function renderMe() {
  if (!session) { $('#me').innerHTML = ''; return; }
  $('#me').innerHTML = `<button onclick="event.stopPropagation();$('#menu').classList.toggle('on')">${avatar(session.user, 28)}${E(session.user.name)}${verifiedBadge(session.user)}<span class="bdg">${nCount || ''}</span> ▾</button>
    <div class="menu" id="menu"><div class="mh"><b>${E(session.user.name)}</b><small>Guest account</small></div>
    <a href="#/profile">Profile</a><a href="#/notifications">Notifications<span class="bdg">${nCount || ''}</span></a><a href="#/friends">Friends</a><a href="#/settings">Settings</a><a href="#/dev">Developer Portal</a><a class="out" onclick="logout(true)">Logout</a></div>`;
}
document.addEventListener('click', () => $('#menu')?.classList.remove('on'));

async function loadGames() { games = await (await fetch(S + '/api/games', { headers: session ? { Authorization: 'Bearer ' + session.token } : {} })).json(); hist.push(total()); hist = hist.slice(-20); }
const spark = () => {
  const mx = Math.max(1, ...hist), pts = hist.map((v, i) => `${(i / (hist.length - 1)) * 150},${44 - (v / mx) * 40}`).join(' ');
  return `<svg viewBox="0 0 150 46"><polyline points="${pts}" fill="none" stroke="#22c55e" stroke-width="2"/></svg>`;
};

function drawCar() {
  const g = games[idx];
  $('#car').innerHTML = `<button class="arr" style="left:0" onclick="go(-1)">‹</button><button class="arr" style="right:0" onclick="go(1)">›</button>
    <div class="l" onclick="location.hash='#/game/${g.id}'">${art(g)}</div>
    <div class="r"><span class="kick">FEATURED</span><h2>${E(g.title)}</h2><div class="meta">${E(g.tagline)}</div><div class="chips">${tags(g)}</div>
    <div class="onl">${g.online ? '<span class="live"></span>' : ''}${g.online} players online</div>
    <div class="shots">${(g.thumb ? [0] : [1, 2, 3]).map(n => art(g, n)).map(a => `<div>${a}</div>`).join('')}</div>
    <a class="btn" href="#/game/${g.id}">Lihat game</a></div>`;
  $('#dots').innerHTML = games.map((_, i) => `<b class="${i === idx ? 'on' : ''}" onclick="idx=${i};drawCar()"></b>`).join('');
}
function go(d) { idx = (idx + d + games.length) % games.length; drawCar(); }

function home() {
  if (!games.length) { // nothing published yet: show a friendly empty state instead of crashing
    $('#view').innerHTML = `<div class="card empty-home"><h2>Belum ada game</h2><p>Jadilah yang pertama menerbitkan game di Voxely.</p><a class="btn" href="#/dev">Buka Developer Portal</a></div>`;
    return;
  }
  const top = [...games].sort((a, b) => b.online - a.online)[0];
  $('#view').innerHTML = `<span class="label">FEATURED &amp; RECOMMENDED</span>
    <div class="cols"><div><div class="car" id="car"></div><div class="dots" id="dots"></div></div>
    <div class="side">
      <div class="card trend"><h4>TRENDING NOW</h4><a href="#/game/${top.id}">${art(top)}<div class="in"><b>${E(top.title)}</b><small>${top.online} online</small></div></a></div>
      <div class="card act"><h4>COMMUNITY ACTIVITY</h4><div class="in">${spark()}<div class="n">${total()}<small>GAMERS ONLINE</small></div></div>
      <div class="foot"><span class="live"></span>${games.filter(g => g.online).length} game sedang aktif</div></div>
    </div></div>
    <h3 class="sec">ALL GAMES</h3>
    <div class="grid">${games.map(g => `<a class="gc" href="#/game/${g.id}">${art(g)}<div class="in"><b>${E(g.title)}</b><small>${g.online ? '<span class="live"></span>' : ''}${g.online} online · Free</small></div></a>`).join('')}</div>`;
  idx = Math.min(idx, games.length - 1); drawCar();
  timer = setInterval(() => $('#car') && go(1), 6000);
}

function gamePage(id) {
  const g = games.find(x => x.id === id); if (!g) return (location.hash = '#/');
  $('#view').innerHTML = `<div class="crumb"><a href="#/">Games</a> &gt; ${E(g.title)}</div><div class="gtitle">${E(g.title)}</div>
    <div class="gmain">${art(g)}<div class="card info"><div>${E(g.tagline)}</div><p style="color:var(--soft);margin-top:8px">${E(g.desc)}</p>
      <dl><dt>PLAYERS ONLINE</dt><dd>${g.online}</dd><dt>VISITS</dt><dd>${g.visits || 0}</dd><dt>TAGS</dt><dd>${tags(g)}</dd><dt>CREATED BY</dt><dd>${E(g.owner || 'Voxely')}</dd></dl></div></div>
    <div class="card buy"><h3>Play ${E(g.title)}</h3><div><span class="free">Free</span><button class="btn" onclick="play('${g.id}')">Play</button></div></div>
    <div class="card about"><b style="color:var(--strong)">About this game</b><br>${E(g.desc)}<br><br>Main langsung dari browser HP atau gunakan Voxely Client di PC. <a onclick="download()">Download Voxely Client</a> tersedia untuk desktop.</div><div id="servers"></div><div id="reviews"></div>`;
  rvDraft = null; loadServers(id); loadReviews(id);
}

function download() {
  if (!VOXELY.download) return alert('Link download belum diatur (CLIENT_DOWNLOAD_URL di Vercel).');
  location.href = VOXELY.download;
}
function show(title, text, dl) {
  $('#lTitle').textContent = title; $('#lText').textContent = text;
  $('#lDl').style.display = dl ? 'block' : 'none'; $('#launch').classList.add('on');
}
async function play(id, room) {
  const ok = await fetch(S + '/api/me', { headers: { Authorization: 'Bearer ' + session.token } }).then(r => r.ok).catch(() => false);
  if (!ok) return logout();
  if (mobileGame) {
    show('Membuka Voxely…', 'Game berjalan langsung di browser HP.', false);
    location.href = `/game/?game=${encodeURIComponent(id)}&room=${encodeURIComponent(room || '')}&token=${encodeURIComponent(session.token)}&server=${encodeURIComponent(S)}`;
    return;
  }
  show('Membuka Voxely Client…', 'Jika browser bertanya, pilih "Open Voxely Client".', false);
  location.href = `voxely://play?game=${id}&room=${room || ''}&token=${session.token}&server=${encodeURIComponent(S)}`;
  setTimeout(() => {
    if (document.hasFocus() && document.visibilityState === 'visible')
      show('Client belum terpasang', 'Download dan install Voxely Client dulu, lalu klik Play lagi.', true);
    else $('#launch').classList.remove('on');
  }, 2500);
}

const THEMES = {
  'blue-dark': { n: "Biru Gelap", d: "Default", l: 0, v: ["#04060b", "#0a0f1a", "#071127", "#050913", "#0d1524", "#101c33", "#0b1428", "#1b2a4a", "#15233f", "#1463ff", "#0a3fb8", "#3a82ff", "#6fa8ff", "#e6edf7", "#7d8aa3", "#b6c2d9", "#ffffff", "#ffffff", "#0f2a5c", "#0a1c3d"] },

function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  for (const [u, n] of AGO) if (s >= n) { const v = Math.floor(s / n); return v + ' ' + u + (v > 1 ? 's' : '') + ' ago'; }
  return 'just now';
}

/* ---------- Profile ---------- */
async function api(path, body) {
  const r = await fetch(S + path, { method: 'POST', headers: AH(), body: JSON.stringify(body) });
  if (r.status === 401) { logout(); throw new Error('login'); }
  return { ok: r.ok, data: await r.json().catch(() => ({})) };
}
async function saveProfile(patch) {
  const r = await api('/api/profile', patch);
  if (r.ok) { session.user = r.data; localStorage.setItem('voxely', JSON.stringify(session)); renderMe(); }
  return r;
}
function profilePage() {
  const u = session.user;
  $('#view').innerHTML = `<span class="label">PROFILE</span>
    <div class="card pad" style="max-width:520px"><div class="prow">${avatar(u, 96)}<div>
      <button class="btn alt" onclick="changeAvatar()">Upload foto profil</button> ${u.av ? '<button class="x" onclick="removeAvatar()">Hapus foto</button>' : ''}
      <small style="display:block;color:var(--dim);margin-top:6px">PNG/JPG/WEBP, otomatis dipotong persegi</small></div></div>
      <label>Nama tampilan</label><input id="pName" maxlength="16" value="${E(u.name)}">
      <div id="pErr" style="color:#ff5c6c;margin-top:8px"></div>
      <button class="btn" onclick="saveName()">Simpan nama</button></div>
    <div class="card pad" style="max-width:520px;margin-top:18px"><h3 class="sec" style="margin:0 0 12px">MY BADGES</h3><div id="myBadges"></div><button class="btn alt" onclick="location.hash='#/badges'">Lihat semua badge</button></div>`;
  loadMyBadges();
}
async function loadMyBadges() {
  const d = await gj('/api/me/badges');
  if (!d || !d.badges || !d.badges.length) {
    $('#myBadges').innerHTML = '<div class="empty">Belum punya badge.</div>';
    return;
  }
  $('#myBadges').innerHTML = `<div class="badge-grid">${d.badges.slice(0, 6).map(b => badgeItem(b)).join('')}</div>`;
}
function badgeItem(b) {
  const color = b.color || '#ffd700';
  return `<div class="badge-item" title="${E(b.name)}${b.gameTitle ? ' · ' + E(b.gameTitle) : ''}\n${E(b.description || '')}" style="background:${color}15;border-color:${color}">
    <span class="badge-icon" style="color:${color}">${E(b.icon || '⭐')}</span>
    <span class="badge-name">${E(b.name)}</span>
    ${b.gameTitle ? `<span class="badge-name" style="color:var(--dim);font-size:10px">${E(b.gameTitle)}</span>` : ''}
  </div>`;
}
function changeAvatar() { pickImage(128, 128, async img => { const r = await saveProfile({ avatar: img }); r.ok ? profilePage() : alert(r.data.error || 'Gagal upload'); }); }
async function removeAvatar() { await saveProfile({ avatar: null }); profilePage(); }
async function saveName() {
  const r = await saveProfile({ name: $('#pName').value });
  if (r.ok) { $('#pErr').textContent = ''; toast('Nama disimpan'); } else $('#pErr').textContent = r.data.error || 'Gagal menyimpan';
}

/* ---------- Thumbnails ---------- */
function drawThumb() { const t = $('#tprev'); if (t) t.innerHTML = dev.thumb ? `<img src="${dev.thumb}" alt="">` : '16:9'; }
function pickThumb() { pickImage(640, 360, img => { dev.thumb = img; drawThumb(); }); }
function setThumb(id) {
  pickImage(640, 360, async img => {
    const r = await api('/api/games/' + id + '/thumb', { image: img });
    if (!r.ok) return alert(r.data.error || 'Gagal upload');
    await loadGames(); drawMine(); toast('Thumbnail diperbarui');
  });
}

/* ---------- People ---------- */
let pq = '', ppl = [];
async function peoplePage() {
  ppl = await (await fetch(S + '/api/people')).json();
  $('#view').innerHTML = `<span class="label">PEOPLE</span><br><input class="search" placeholder="Cari nama…" value="${E(pq)}" oninput="pq=this.value;drawPeople()"><div class="grid" id="pp"></div>`;
  drawPeople();
}
function drawPeople() {
  const l = ppl.filter(p => p.name.toLowerCase().includes(pq.toLowerCase()));
  $('#pp').innerHTML = l.length ? l.map(p => `<a class="pc" href="#/user/${p.uid}">${avatar(p, 40)}<div><b>${E(p.name)}</b><small>${p.game ? '<span class="live"></span>Bermain: ' + E(p.game) : 'Offline'}</small></div></a>`).join('') : '<div class="empty">Tidak ada pemain.</div>';
}

/* ---------- Developer Portal: dashboard, Studio launcher, game management ---------- */
async function openStudio(id) {
  const ok = await fetch(S + '/api/me', { headers: { Authorization: 'Bearer ' + session.token } }).then(r => r.ok).catch(() => false);
  if (!ok) return logout();
  show('Membuka Voxely Studio…', 'Jika browser bertanya, pilih "Open Voxely Client".', false);
  location.href = `voxely://studio?game=${id || 'new'}&token=${session.token}&server=${encodeURIComponent(S)}`;
  setTimeout(() => {
    if (document.hasFocus() && document.visibilityState === 'visible') show('Client belum terpasang', 'Voxely Studio ada di dalam Voxely Client. Download dan install client versi terbaru dulu, lalu coba lagi.', true);
    else $('#launch').classList.remove('on');
  }, 2500);
}
async function devHome() {
  await loadGames(); const mine = games.filter(g => g.mine);
  $('#view').innerHTML = `<span class="label">DEVELOPER PORTAL</span>
    <div class="card pad"><h3 class="ft">Buat game</h3>
      <div class="hint"><b>Voxely Studio</b> ada di dalam Voxely Client: editor 3D dengan Explorer, Properties, dan <b>script</b> (JavaScript) supaya game kamu lebih bebas. Klik tombol di bawah untuk membukanya (client harus terpasang).<br>${session.user.google ? '✓ Kamu login dengan Google: game kamu disimpan permanen.' : '⚠ Login sebagai guest: game hanya tersimpan sementara. Login dengan Google agar tersimpan permanen.'}</div>
      <div class="acts"><button class="btn" onclick="openStudio('new')">Buka Studio — game baru</button><a class="btn alt" href="#/dev/quick">Editor cepat (web)</a></div></div>
    <h3 class="sec">GAME SAYA</h3>
    ${mine.length ? `<div class="grid">${mine.map(g => `<div class="gc dv">${art(g)}<div class="in"><b>${E(g.title)}</b><small>${g.visits || 0} visits · ${g.online} online</small>
      <div class="acts"><a class="btn sm" href="#/manage/${g.id}">Kelola</a><button class="btn sm alt" onclick="openStudio('${g.id}')">Studio</button></div></div></div>`).join('')}</div>` : '<div class="card empty">Belum ada game. Buat yang pertama di Studio!</div>'}`;
}
let mgTab = 'stats';
async function managePage(id) {
  await loadGames(); const g = games.find(x => x.id === id && x.mine);
  if (!g) { location.hash = '#/dev'; return; }
  $('#view').innerHTML = `<div class="crumb"><a href="#/dev">Developer Portal</a> &gt; ${E(g.title)}</div>
    <div class="mgh"><div class="mga">${art(g)}</div><div><h1 class="ftitle">${E(g.title)}</h1>
      <div style="color:var(--dim);margin-bottom:12px">${tags(g)} ${g.visits || 0} visits · ${g.online} online</div>
      <div class="acts"><button class="btn sm" onclick="play('${id}')">Main</button><button class="btn sm alt" onclick="openStudio('${id}')">Buka di Studio</button><a class="btn sm alt" href="#/game/${id}">Halaman game</a></div></div></div>
    <div class="avtabs" style="margin-top:18px">${[['stats', 'Statistik'], ['reviews', 'Review'], ['badges', 'Badge'], ['settings', 'Pengaturan']].map(([k, n]) => `<button class="vb ${mgTab === k ? 'on' : ''}" onclick="mgTab='${k}';managePage('${id}')">${n}</button>`).join('')}</div>
    <div id="mgbody"><div class="empty">Memuat…</div></div>`;
  ({ stats: mgStats, reviews: mgReviews, badges: mgBadges, settings: mgSettings })[mgTab](id);
}
async function mgStats(id) {
  const d = await gj('/api/games/' + id + '/stats'); if (!d) return ($('#mgbody').innerHTML = '<div class="card empty">Statistik tidak tersedia.</div>');
  const dur = s => s >= 3600 ? (s / 3600).toFixed(1) + ' jam' : s >= 60 ? Math.round(s / 60) + ' mnt' : s + ' dtk';
  const mx = Math.max(1, ...d.daily.map(x => x.n)), card = (n, l) => `<div class="stc"><b>${n}</b><small>${l}</small></div>`;
  $('#mgbody').innerHTML = `<div class="stgrid">${card(d.visits, 'Total kunjungan')}${card(d.unique, 'Pemain unik')}${card(d.online, 'Online sekarang')}${card(d.peak, 'Puncak online')}${card(dur(d.secs), 'Total waktu bermain')}${card(dur(d.avg), 'Rata-rata sesi')}${card(d.servers, 'Server aktif')}${card(d.reviews ? Math.round(d.up / d.reviews * 100) + '% (' + d.reviews + ')' : '-', 'Review positif')}</div>
    <div class="card pad" style="margin-top:14px"><h3 class="ft">Kunjungan 14 hari terakhir</h3><div class="chart">${d.daily.map(x => `<div class="cb" title="${x.d}: ${x.n}"><span>${x.n || ''}</span><i style="height:${Math.round(x.n / mx * 100)}%"></i><small>${x.d.slice(8)}</small></div>`).join('')}</div></div>
    <div class="acts"><button class="btn sm alt" onclick="managePage('${id}')">Refresh</button></div>`;
}
async function mgReviews(id) {
  const d = await gj('/api/games/' + id + '/reviews?sort=recent');
  $('#mgbody').innerHTML = !d || !d.reviews.length ? '<div class="card empty">Belum ada review untuk game ini.</div>'
    : `<div class="hint">${d.total} review · ${Math.round(d.up / d.total * 100)}% merekomendasikan</div>` + d.reviews.map(x => `<div class="rv"><div><a href="#/user/${x.uid}">${avatar(x, 56)}</a></div><div class="rvr">
      <div class="rvh"><a href="#/user/${x.uid}"><b>${E(x.name)}</b></a> <span>- ${dateStr(x.ts)}</span></div>
      <div class="rec ${x.up ? '' : 'neg'}">${x.up ? IC.up : IC.down}<div><b>${x.up ? 'Recommended' : 'Not Recommended'}</b></div></div><p>${E(x.text)}</p>
      <div class="rvf"><span>${x.yes} orang menilai review ini berguna</span></div></div></div>`).join('');
}
async function mgSettings(id) {
  const d = await gj('/api/games/' + id + '/source'); if (!d) return ($('#mgbody').innerHTML = '<div class="card empty">Tidak bisa memuat pengaturan.</div>');
  $('#mgbody').innerHTML = `<div class="card pad" style="max-width:720px"><h3 class="ft">Pengaturan game</h3>
    <label>Nama game</label><input id="sTitle" maxlength="30" value="${E(d.title)}">
    <label>Tagline</label><input id="sTag" maxlength="60" value="${E(d.tagline)}">
    <label>Deskripsi</label><textarea id="sDesc" maxlength="400">${E(d.desc)}</textarea>
    <label>Tag (pisahkan koma, maks 3)</label><input id="sTags" value="${E((d.tags || []).join(', '))}">
    <label>Thumbnail</label><div class="trow"><div class="tprev" id="stprev">${d.hasThumb ? `<img src="${S}/api/thumb/${id}?v=${Date.now()}" alt="">` : '16:9'}</div><button class="btn alt" onclick="mgThumb('${id}')">Upload thumbnail baru</button></div>
    <div id="sErr" class="err" style="margin-top:10px"></div><button class="btn" onclick="mgSave('${id}')">Simpan perubahan</button>
    <div class="sep2"></div><button class="x" onclick="mgDelete('${id}')">Hapus game ini</button></div>`;
}
async function mgSave(id) {
  const r = await rq('PUT', '/api/games/' + id, { title: $('#sTitle').value, tagline: $('#sTag').value, desc: $('#sDesc').value, tags: $('#sTags').value.split(',').map(t => t.trim()).filter(Boolean) });
  if (!r.ok) { $('#sErr').textContent = r.data.error || 'Gagal menyimpan'; return; }
  toast('Perubahan disimpan'); managePage(id);
}
function mgThumb(id) {
  pickImage(640, 360, async img => {
    const r = await rq('POST', '/api/games/' + id + '/thumb', { image: img });
    if (!r.ok) return alert(r.data.error || 'Gagal upload'); toast('Thumbnail diperbarui'); managePage(id);
  });
}
async function mgDelete(id) { if (!confirm('Hapus game ini selamanya? Review dan statistiknya ikut hilang.')) return; await rq('DELETE', '/api/games/' + id); location.hash = '#/dev'; }

/* ---------- Badges of a game (Kelola -> Badge) ---------- */
const trigText = b => b.trigger === 'playtime' ? 'Bermain ' + b.value + ' menit' : b.trigger === 'touch' ? 'Sentuh part "' + b.value + '"' : 'Pertama kali bergabung';
async function mgBadges(id) {
  const d = await gj('/api/games/' + id + '/badges');
  if (!d) return ($('#mgbody').innerHTML = '<div class="card empty">Tidak bisa memuat badge.</div>');
  $('#mgbody').innerHTML = `<div class="hint">Pemain mendapatkan badge saat bermain game ini, lalu badge tampil di profil mereka.</div>
    ${d.badges.length ? `<div class="badge-grid">${d.badges.map(b => `<div>${badgeItem(b)}<small style="display:block;color:var(--dim);margin:4px 0 6px">${E(trigText(b))} · ${b.earners} pemain</small><button class="x" onclick="mgDelBadge('${id}','${b.id}')">Hapus</button></div>`).join('')}</div>` : '<div class="card empty">Belum ada badge. Buat badge pertama di bawah.</div>'}
    <div class="card pad" style="margin-top:14px;max-width:640px"><h3 class="ft">Buat badge baru</h3>
      <label>Nama badge</label><input id="bName" maxlength="40" placeholder="contoh: Pendaki">
      <label>Deskripsi</label><input id="bDesc" maxlength="200" placeholder="Cara mendapatkannya">
      <div style="display:flex;gap:12px"><div style="flex:1"><label>Ikon (emoji)</label><input id="bIcon" maxlength="4" value="⭐"></div><div><label>Warna</label><input id="bColor" type="color" value="#ffd700"></div></div>
      <label>Cara mendapatkan</label><select id="bTrig" onchange="mgTrigChange()"><option value="join">Pertama kali bergabung ke game</option><option value="playtime">Bermain selama beberapa menit</option><option value="touch">Menyentuh part tertentu</option></select>
      <label id="bValLab">Tidak perlu isi apa-apa</label><input id="bVal" disabled>
      <div id="bErr" class="err" style="margin-top:10px"></div>
      <button class="btn" onclick="mgAddBadge('${id}')">Buat badge</button></div>`;
}
function mgTrigChange() {
  const t = $('#bTrig').value, v = $('#bVal'), lab = $('#bValLab');
  v.value = ''; v.disabled = t === 'join'; v.type = t === 'playtime' ? 'number' : 'text';
  v.placeholder = t === 'playtime' ? 'contoh: 5' : t === 'touch' ? 'contoh: Puncak' : '';
  lab.textContent = t === 'playtime' ? 'Berapa menit bermain?' : t === 'touch' ? 'Nama part (sama persis dengan "Nama part" di editor)' : 'Tidak perlu isi apa-apa';
}
async function mgAddBadge(id) {
  const err = $('#bErr'); err.textContent = '';
  const r = await rq('POST', '/api/games/' + id + '/badges', { name: $('#bName').value, description: $('#bDesc').value, icon: $('#bIcon').value, color: $('#bColor').value, trigger: $('#bTrig').value, value: $('#bVal').value });
  if (!r.ok) { err.textContent = r.data.error || 'Gagal membuat badge'; return; }
  toast('Badge dibuat'); mgBadges(id);
}
async function mgDelBadge(id, bid) {
  if (!confirm('Hapus badge ini? Badge hilang dari pemain yang sudah mendapatkannya.')) return;
  await rq('DELETE', '/api/games/' + id + '/badges/' + bid); mgBadges(id);
}

/* ---------- Developer Portal (visual editor) ---------- */
let dev = null;
const AH = () => ({ 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token });
const PAL = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#ffffff', '#9ca3af', '#374151', '#8b5a2b'];
const GR = c => ({ x: 0, y: -0.5, z: 0, w: 40, h: 1, d: 40, c });
const TPL = {
  flat: { n: 'Lapangan', sky: '#7ec8ff', b: () => [GR('#5cb85c'), { x: 6, y: 1, z: 4, w: 4, h: 2, d: 4, c: '#e0a040' }, { x: -8, y: 0.75, z: -6, w: 6, h: 1.5, d: 3, c: '#8e6bd0' }, { x: 6, y: 1, z: 1.85, w: 1.4, h: 2, d: 0.3, c: '#c8903c', l: 1 }] },
  obby: { n: 'Obby melayang', sky: '#1b2a49', b: () => [{ x: 0, y: -0.5, z: 0, w: 10, h: 1, d: 10, c: '#3b82f6' }, { x: 0, y: 1, z: 11, w: 4, h: 1, d: 4, c: '#f97316' }, { x: 5, y: 2.5, z: 17, w: 4, h: 1, d: 4, c: '#eab308' }, { x: 11, y: 4, z: 20, w: 4, h: 1, d: 4, c: '#22c55e' }, { x: 17, y: 5.5, z: 14, w: 3, h: 1, d: 3, c: '#ec4899' }, { x: 20, y: 7, z: 7, w: 8, h: 1, d: 8, c: '#ffffff' }] },
  stairs: { n: 'Tangga', sky: '#ffd6e8', b: () => [GR('#f9a8d4'), ...Array.from({ length: 8 }, (_, i) => ({ x: 0, y: i * 0.8 + 0.4, z: i * 3 - 6, w: 8, h: 0.8, d: 3, c: i % 2 ? '#a7f3d0' : '#fde68a' }))] },
  blank: { n: 'Kosong', sky: '#7ec8ff', b: () => [{ x: 0, y: -0.5, z: 0, w: 12, h: 1, d: 12, c: '#5cb85c' }] }
};
const topOf = b => +(b.y + b.h / 2).toFixed(1);
const fresh = () => ({ id: null, title: '', tagline: '', desc: '', tags: '', sky: '#7ec8ff', a1: '#1463ff', a2: '#0a0f1a', boxes: TPL.flat.b(), sel: 0, scale: 8, thumb: null });
function newDev() {
  try { const d = JSON.parse(localStorage.getItem('voxelyDraft')); if (d && d.boxes?.length) return { ...fresh(), ...d, id: null, thumb: null, sel: 0 }; } catch (e) {}
  return fresh();
}
function draft() { if (!dev.id) try { localStorage.setItem('voxelyDraft', JSON.stringify({ ...dev, thumb: null })); } catch (e) {} }
function devNew() { dev = fresh(); localStorage.removeItem('voxelyDraft'); devPage(); }

async function devPage() {
  await loadGames(); dev = dev || newDev();
  const ed = !!dev.id;
  $('#view').innerHTML = `<span class="label">EDITOR CEPAT</span> <a href="#/dev" style="color:var(--link);margin-left:10px">← Developer Portal</a>
    <div class="cols"><div>
      <div class="card pad step"><h3 class="ft"><i class="sn">1</i> Info game</h3>
        ${ed ? '<div class="hint">Kamu sedang mengedit game yang sudah dipublish. <a style="color:var(--link)" onclick="devNew()">Buat game baru</a></div>' : '<div class="hint">Isi nama dan deskripsi game kamu. Semua bisa diubah lagi nanti.</div>'}
        <label>Judul game</label><input maxlength="30" placeholder="Contoh: Pulau Obby" value="${E(dev.title)}" oninput="dev.title=this.value;draft()">
        <label>Tagline (kalimat pendek)</label><input maxlength="60" placeholder="Contoh: Lompat sampai puncak!" value="${E(dev.tagline)}" oninput="dev.tagline=this.value;draft()">
        <label>Deskripsi</label><textarea maxlength="400" placeholder="Ceritakan tentang game kamu…" oninput="dev.desc=this.value;draft()">${E(dev.desc)}</textarea>
        <label>Tag (pisahkan dengan koma, maks 3)</label><input placeholder="Obby, Santai, Seru" value="${E(dev.tags)}" oninput="dev.tags=this.value;draft()">
        <label>Thumbnail <small>(opsional — kalau kosong dipakai warna cover)</small></label>
        <div class="trow"><div class="tprev" id="tprev"></div><button class="btn alt" onclick="pickThumb()">Upload thumbnail</button></div>
        <div class="row3"><div><label>Warna langit</label><input type="color" value="${dev.sky}" oninput="dev.sky=this.value;draw();draft()"></div>
          <div><label>Cover 1</label><input type="color" value="${dev.a1}" oninput="dev.a1=this.value;draft()"></div>
          <div><label>Cover 2</label><input type="color" value="${dev.a2}" oninput="dev.a2=this.value;draft()"></div></div>
      </div>
      <div class="card pad step" style="margin-top:14px"><h3 class="ft"><i class="sn">2</i> Bangun dunia</h3>
        <div class="hint"><b>Cara pakai:</b> tarik kotak untuk memindahkan · klik dua kali di peta untuk menambah platform · kotak pertama (<b>START</b>) adalah tempat pemain muncul · angka di kotak = ketinggiannya · <b>+ Tangga</b> membuat tangga yang bisa dipanjat pemain (tahan W).</div>
        <div class="tpl">Mulai dari template: ${Object.entries(TPL).map(([k, t]) => `<button class="vb" onclick="applyTpl('${k}')">${t.n}</button>`).join('')}</div>
        <div class="tools"><button class="btn sm" onclick="addPlat()">+ Platform</button><button class="btn sm alt" onclick="addLadder()">+ Tangga</button><button class="btn sm alt" onclick="zoom(1.25)">Zoom +</button><button class="btn sm alt" onclick="zoom(0.8)">Zoom −</button><small id="cnt" style="color:var(--dim)"></small></div>
        <canvas id="cv" width="720" height="440"></canvas><div id="selp"></div>
      </div>
      <div class="card pad step" style="margin-top:14px"><h3 class="ft"><i class="sn">3</i> Publish</h3>
        <div class="hint">Setelah publish, game langsung muncul di Store dan bisa dimainkan lewat tombol Play.<br>${session.user.google ? '✓ Kamu login dengan Google: game kamu <b>disimpan permanen</b> dan tidak hilang saat server di-update.' : '⚠ Kamu login sebagai guest: game hanya tersimpan sementara dan bisa hilang saat server di-update. Login dengan Google agar tersimpan permanen.'}</div>
        <div id="dErr" class="err"></div><button class="btn" onclick="publish()">${ed ? 'Simpan perubahan' : 'Publish game'}</button></div>
    </div>
    <div class="side"><div class="card"><h4>GAME SAYA</h4><div id="mine"></div></div></div></div>`;
  bindCanvas(); draw(); drawSel(); drawMine(); drawThumb();
}
function applyTpl(k) {
  if (dev.boxes.length > 3 && !confirm('Ganti dunia dengan template ini? Perubahan di peta akan hilang.')) return;
  dev.boxes = TPL[k].b(); dev.sky = TPL[k].sky; dev.sel = 0; draft(); devPage();
}
function zoom(f) { dev.scale = Math.max(2, Math.min(24, dev.scale * f)); draw(); }
function addPlat(x, z) {
  if (dev.boxes.length >= 40) return toast('Maksimal 40 platform');
  const n = dev.boxes.length;
  dev.boxes.push({ x: x ?? (n * 3) % 15 - 6, y: 0.5, z: z ?? 0, w: 4, h: 1, d: 4, c: PAL[Math.floor(Math.random() * 8)] });
  dev.sel = n; draw(); drawSel(); draft();
}
function addLadder() {
  if (dev.boxes.length >= 40) return toast('Maksimal 40 platform');
  dev.boxes.push({ x: 0, y: 2, z: 0, w: 1.4, h: 4, d: 0.3, c: '#c8903c', l: 1 }); dev.sel = dev.boxes.length - 1; draw(); drawSel(); draft();
}
function dupPlat() { const b = dev.boxes[dev.sel]; if (b) { addPlat(b.x + 2, b.z + 2); Object.assign(dev.boxes[dev.sel], { y: b.y, w: b.w, h: b.h, d: b.d, c: b.c, l: b.l }); draw(); drawSel(); draft(); } }
function delPlat() { if (dev.boxes.length < 2) return toast('Minimal 1 platform'); dev.boxes.splice(dev.sel, 1); dev.sel = Math.min(dev.sel, dev.boxes.length - 1); draw(); drawSel(); draft(); }
function makeStart() { const i = dev.sel; [dev.boxes[0], dev.boxes[i]] = [dev.boxes[i], dev.boxes[0]]; dev.sel = 0; draw(); drawSel(); draft(); }
function setProp(k, v) {
  const b = dev.boxes[dev.sel]; if (!b) return;
  if (k === 'c') b.c = v;
  else if (k === 'top') b.y = v - b.h / 2;
  else if (k === 'h') { const t = topOf(b); b.h = v; b.y = t - v / 2; }
  else b[k] = v;
  const lab = $('#v_' + k); if (lab) lab.textContent = k === 'top' ? v : b[k];
  draw(); draft();
}
function drawSel() {
  const el = $('#selp'); if (!el) return;
  $('#cnt').textContent = dev.boxes.length + ' platform';
  const b = dev.boxes[dev.sel];
  if (!b) { el.innerHTML = '<div class="empty">Klik sebuah platform di peta untuk mengubah ukuran dan warnanya.</div>'; return; }
  const sl = (k, lab, min, max, val) => `<div><label>${lab}: <b id="v_${k}">${val}</b></label><input type="range" min="${min}" max="${max}" step="0.5" value="${val}" oninput="setProp('${k}', +this.value)"></div>`;
  el.innerHTML = `<div class="selp"><b>Platform ${dev.sel + 1}${dev.sel === 0 ? ' · START' : ''}</b>
    <div class="row2">${sl('w', 'Lebar (kiri-kanan)', 1, 60, b.w)}${sl('d', 'Panjang (depan-belakang)', 1, 60, b.d)}${sl('h', 'Tebal', 0.5, 10, b.h)}${sl('top', 'Ketinggian dari dasar', 0, 40, topOf(b))}</div>
    <label>Warna</label><div class="sw">${PAL.map(c => `<button class="swb ${c === b.c ? 'on' : ''}" style="background:${c}" onclick="setProp('c','${c}');drawSel()"></button>`).join('')}<input type="color" value="${b.c}" oninput="setProp('c',this.value)"></div>
    <label class="chk"><input type="checkbox" ${b.l ? 'checked' : ''} onchange="setProp('l', this.checked ? 1 : 0)"> Bisa dipanjat (tangga, tahan W)</label>
    <label>Nama part <small style="color:var(--dim)">(dipakai badge "sentuh part")</small></label><input value="${E(b.n || '')}" maxlength="30" placeholder="contoh: Puncak" oninput="setProp('n', this.value)">
    <div class="acts"><button class="btn sm alt" ${dev.sel === 0 ? 'disabled' : ''} onclick="makeStart()">Jadikan START</button><button class="btn sm alt" onclick="dupPlat()">Duplikat</button><button class="x" onclick="delPlat()">Hapus</button></div></div>`;
}
function draw() {
  const c = $('#cv'); if (!c) return;
  const g = c.getContext('2d'), s = dev.scale, W = c.width, H = c.height;
  g.fillStyle = dev.sky; g.fillRect(0, 0, W, H); g.lineWidth = 1;
  for (let u = -500; u <= 500; u += 5) {
    const px = W / 2 + u * s, pz = H / 2 - u * s;
    g.strokeStyle = u === 0 ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.14)';
    if (px >= 0 && px <= W) { g.beginPath(); g.moveTo(px, 0); g.lineTo(px, H); g.stroke(); }
    if (pz >= 0 && pz <= H) { g.beginPath(); g.moveTo(0, pz); g.lineTo(W, pz); g.stroke(); }
  }
  g.font = 'bold 12px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  dev.boxes.map((b, i) => i).sort((a, b) => topOf(dev.boxes[a]) - topOf(dev.boxes[b])).forEach(i => {
    const b = dev.boxes[i], x = W / 2 + (b.x - b.w / 2) * s, y = H / 2 - (b.z + b.d / 2) * s, w = b.w * s, h = b.d * s;
    g.fillStyle = b.c; g.fillRect(x, y, w, h);
    g.lineWidth = i === dev.sel ? 3 : 1; g.strokeStyle = i === dev.sel ? '#fff' : 'rgba(0,0,0,.5)'; g.strokeRect(x, y, w, h);
    if (b.l) { g.lineWidth = 1; g.strokeStyle = 'rgba(0,0,0,.7)'; for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(x, y + h * k / 4); g.lineTo(x + w, y + h * k / 4); g.stroke(); } }
    if (w > 22 && h > 16) { const t = (i === 0 ? 'START ' : '') + topOf(b); g.lineWidth = 3; g.strokeStyle = '#000'; g.strokeText(t, x + w / 2, y + h / 2); g.fillStyle = '#fff'; g.fillText(t, x + w / 2, y + h / 2); }
  });
}
function bindCanvas() {
  const c = $('#cv'); let drag = null;
  const pt = e => { const r = c.getBoundingClientRect(); return { x: ((e.clientX - r.left) * c.width / r.width - c.width / 2) / dev.scale, z: -((e.clientY - r.top) * c.height / r.height - c.height / 2) / dev.scale }; };
  const hit = p => dev.boxes.map((b, i) => i).sort((a, b) => topOf(dev.boxes[b]) - topOf(dev.boxes[a])).find(i => { const b = dev.boxes[i]; return Math.abs(p.x - b.x) <= b.w / 2 && Math.abs(p.z - b.z) <= b.d / 2; });
  c.onpointerdown = e => {
    const p = pt(e), i = hit(p); dev.sel = i === undefined ? -1 : i;
    if (i !== undefined) { drag = { dx: p.x - dev.boxes[i].x, dz: p.z - dev.boxes[i].z }; c.setPointerCapture(e.pointerId); }
    draw(); drawSel();
  };
  c.onpointermove = e => {
    if (!drag) return; const p = pt(e), b = dev.boxes[dev.sel], sn = v => Math.max(-500, Math.min(500, Math.round(v * 2) / 2));
    b.x = sn(p.x - drag.dx); b.z = sn(p.z - drag.dz); draw();
  };
  c.onpointerup = () => { if (drag) draft(); drag = null; };
  c.ondblclick = e => { const p = pt(e); addPlat(Math.round(p.x * 2) / 2, Math.round(p.z * 2) / 2); };
}
function drawMine() {
  const m = games.filter(g => g.mine);
  $('#mine').innerHTML = m.length ? m.map(g => `<div class="mrow"><a href="#/game/${g.id}">${E(g.title)}</a><small>${g.online} online</small><button class="x" onclick="editGame('${g.id}')">Edit</button><button class="x" onclick="setThumb('${g.id}')">Thumb</button><button class="x" onclick="delGame('${g.id}')">Hapus</button></div>`).join('') : '<div class="empty">Belum ada game. Buat yang pertama di sebelah kiri!</div>';
}
async function editGame(id) {
  const d = await gj('/api/games/' + id + '/source'); if (!d) return alert('Tidak bisa memuat game ini');
  dev = { id, title: d.title, tagline: d.tagline, desc: d.desc, tags: d.tags.join(', '), sky: d.sky, a1: d.art[0], a2: d.art[1], boxes: d.boxes, sel: 0, scale: 8, thumb: null };
  await devPage(); window.scrollTo(0, 0);
}
async function delGame(id) {
  if (!confirm('Hapus game ini?')) return;
  await fetch(S + '/api/games/' + id, { method: 'DELETE', headers: AH() });
  if (dev && dev.id === id) dev = null;
  devPage();
}
async function publish() {
  const err = $('#dErr'); err.textContent = '';
  if (dev.title.trim().length < 3) { err.textContent = 'Isi judul game dulu (minimal 3 huruf) di langkah 1.'; return; }
  const body = { title: dev.title, tagline: dev.tagline, desc: dev.desc, tags: dev.tags.split(',').map(t => t.trim()).filter(Boolean), sky: dev.sky, art: [dev.a1, dev.a2], boxes: dev.boxes, thumb: dev.thumb || undefined };
  const r = await rq(dev.id ? 'PUT' : 'POST', dev.id ? '/api/games/' + dev.id : '/api/games', body);
  if (!r.ok) { err.textContent = r.data.error || 'Gagal publish'; return; }
  const id = dev.id || r.data.id; localStorage.removeItem('voxelyDraft'); dev = null; location.hash = '#/game/' + id;
}

/* ---------- Friends & notifications ---------- */
async function refreshBadge() {
  if (!session) return;
  const d = await gj('/api/notifications').catch(() => null); if (!d) return;
  nCount = d.unread; document.querySelectorAll('.bdg').forEach(b => (b.textContent = nCount || ''));
}
async function friendAct(uid, a) {
  const r = await rq('POST', '/api/friends/' + uid + '/' + a, {});
  if (!r.ok) alert(r.data.error || 'Gagal'); route(); refreshBadge();
}
async function unfriend(uid) { if (!confirm('Hapus dari daftar teman?')) return; await rq('DELETE', '/api/friends/' + uid); route(); refreshBadge(); }
const status = p => p.game ? '<span class="live"></span>Bermain: ' + E(p.game) : 'Offline';
async function toggleFollow(uid, following) { const r=following ? await rq('DELETE','/api/users/'+uid+'/follow',{}) : await rq('POST','/api/users/'+uid+'/follow',{}); if(!r.ok) return alert(r.data.error||'Gagal mengubah follow'); userPage(uid); }
async function userPage(uid) {
  if (uid === session.user.uid) return (location.hash = '#/profile');
  const d = await gj('/api/users/' + uid);
  if (!d) return ($('#view').innerHTML = '<div class="card empty">Pengguna tidak ditemukan (mungkin server sempat restart).</div>');
  const A = (a, t, c) => `<button class="btn ${c || ''}" onclick="friendAct('${uid}','${a}')">${t}</button>`;
  const follow = d.followed ? `<button class="btn alt" onclick="toggleFollow('${uid}',true)">Following</button>` : `<button class="btn" onclick="toggleFollow('${uid}',false)">Follow</button>`;
  const act = { none: A('request', '+ Add Friend'), sent: `<button class="btn alt" disabled>Request terkirim</button> ${A('cancel', 'Batalkan', 'alt')}`,
    received: `${A('accept', 'Terima pertemanan')} ${A('decline', 'Tolak', 'alt')}`, friends: `<span class="free">✓ Friends</span><button class="x" onclick="unfriend('${uid}')">Unfriend</button>` }[d.friend] || '';
  const profileActions = `${follow} ${act}`;
  $('#view').innerHTML = `<div class="crumb"><a href="#/people">People</a> &gt; ${E(d.name)}</div>
    <div class="card pad prof">${avatar(d, 110)}${d.outfit ? '<canvas id="uav" width="140" height="175"></canvas>' : ''}<div><h1 class="ftitle" style="margin:0">${E(d.name)}${verifiedBadge(d)}</h1>
      <div style="color:var(--dim);margin:6px 0 4px">${status(d)} · ${d.friends} friends</div><div class="follow-stat"><b>${d.followers || 0}</b> followers · <b>${d.following || 0}</b> following</div><div class="acts">${profileActions}</div></div></div>
    ${d.badges && d.badges.length ? `<div class="card pad" style="margin-top:18px"><h3 class="sec" style="margin:0 0 12px">BADGES</h3><div class="badge-grid">${d.badges.map(b => badgeItem(b)).join('')}</div></div>` : ''}
    <h3 class="sec">GAMES BY ${E(d.name).toUpperCase()}</h3>
    ${d.games.length ? `<div class="grid">${d.games.map(g => `<a class="gc" href="#/game/${g.id}">${art(g)}<div class="in"><b>${E(g.title)}</b><small>${g.online} online</small></div></a>`).join('')}</div>` : '<div class="card empty">Belum membuat game.</div>'}`;
  if (d.outfit && $('#uav')) drawAvatar($('#uav'), d.outfit);
}
async function notifPage() {
  const d = await gj('/api/notifications'); if (!d) return;
  const row = (x, body, btns) => `<div class="nr"><a href="#/user/${x.user.uid}">${avatar(x.user, 44)}</a><div class="nt"><div>${body}</div><small>${ago(x.ts)}</small></div><div>${btns}</div></div>`;
  const nm = x => `<a href="#/user/${x.user.uid}"><b>${E(x.user.name)}</b></a>`;
  const all = [...d.requests.map(x => row(x, nm(x) + ' ingin berteman denganmu', `<button class="btn sm" onclick="friendAct('${x.user.uid}','accept')">Terima</button> <button class="btn sm alt" onclick="friendAct('${x.user.uid}','decline')">Tolak</button>`)),
    ...d.accepted.map(x => row(x, nm(x) + ' menerima permintaan pertemananmu', ''))];
  $('#view').innerHTML = `<span class="label">NOTIFICATIONS</span>${all.length ? `<div class="card">${all.join('')}</div>` : '<div class="card empty">Belum ada notifikasi.</div>'}`;
  if (d.accepted.some(x => !x.read)) { await rq('POST', '/api/notifications/read', {}); refreshBadge(); }
}
async function friendsPage() {
  const d = await gj('/api/friends'); if (!d) return;
  $('#view').innerHTML = `<span class="label">FRIENDS</span>${d.friends.length ? `<div class="grid">${d.friends.map(p => `<a class="pc" href="#/user/${p.uid}">${avatar(p, 40)}<div><b>${E(p.name)}</b><small>${status(p)}</small></div></a>`).join('')}</div>` : '<div class="card empty">Belum punya teman. Buka <a href="#/people" style="color:var(--link)">People</a>, klik profil seseorang, lalu Add Friend.</div>'}`;
}
async function badgesPage() {
  const all = await gj('/api/badges');
  const mine = await gj('/api/me/badges');
  const mineIds = new Set(((mine && mine.badges) || []).map(b => b.id));
  let html = `<span class="label">BADGES</span>
    <div class="hint">Badge didapat dengan bermain game. Setiap badge milik satu game; developer membuatnya di Developer Portal → Kelola → Badge.</div>`;
  if (mine && mine.badges.length) html += `<div class="card pad" style="margin-bottom:18px"><h3 class="sec" style="margin:0 0 12px">BADGE SAYA (${mine.total})</h3><div class="badge-grid">${mine.badges.map(b => badgeItem(b)).join('')}</div></div>`;
  if (all && all.badges.length) html += `<div class="card pad"><h3 class="sec" style="margin:0 0 12px">SEMUA BADGE (${all.total})</h3><div class="badge-grid">${all.badges.map(b => badgeItem({ ...b, description: (mineIds.has(b.id) ? '✓ Sudah kamu dapatkan. ' : '') + (b.description || '') })).join('')}</div></div>`;
  else html += '<div class="card empty">Belum ada badge di game mana pun.</div>';
  $('#view').innerHTML = html;
}

async function route() {
  clearInterval(timer);
  if (!session) return $('#login').classList.add('on');
  const h = location.hash;
    $('#nForum').classList.toggle('on', h.startsWith('#/forum'));
  $('#nAvatar').classList.toggle('on', h.startsWith('#/avatar'));
  $('#nMarket').classList.toggle('on', h.startsWith('#/marketplace'));
  $('#nGames').classList.toggle('on', !/^#\/(people|forum|avatar|marketplace|settings)/.test(h));
  $('#nPeople').classList.toggle('on', h.startsWith('#/people'));
  if (h.startsWith('#/dev/quick')) return devPage();
  if (h.startsWith('#/dev')) return devHome();
  if (h.startsWith('#/manage/')) return managePage(h.slice(9));
  if (h.startsWith('#/profile')) return profilePage();
  if (h.startsWith('#/forum')) return forumRoute(h);
  if (h.startsWith('#/avatar')) return avatarPage();
  if (h.startsWith('#/marketplace')) return marketplacePage();
  if (h.startsWith('#/settings')) return settingsPage();
  if (h.startsWith('#/user/')) return userPage(h.slice(7));
  if (h.startsWith('#/notifications')) return notifPage();
  if (h.startsWith('#/friends')) return friendsPage();
  if (h.startsWith('#/people')) return peoplePage();
  if (h.startsWith('#/badges')) return badgesPage();
  await loadGames();
  const m = h.match(/^#\/game\/(\w+)/);
  m ? gamePage(m[1]) : home();
}
$('#guestBtn').onclick = guestLogin;
$('#nick').onkeydown = e => e.key === 'Enter' && guestLogin();
window.onhashchange = route;
setInterval(() => session && !/^#\/(dev|profile|forum|avatar|marketplace|settings|manage)/.test(location.hash) && ![...document.querySelectorAll('textarea')].some(t => t.value) && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !$('#launch').classList.contains('on') && route(), 10000);
async function refreshMe() { // validate the saved session and pick up uid/avatar
  if (!session) return;
  const r = await fetch(S + '/api/me', { headers: { Authorization: 'Bearer ' + session.token } }).catch(() => null);
  if (r && r.status === 401) { localStorage.removeItem('voxely'); session = null; renderMe(); }
  else if (r && r.ok) { session.user = await r.json(); localStorage.setItem('voxely', JSON.stringify(session)); renderMe(); }
}
/* ---------- Google login (Supabase) ---------- */
async function googleLogin() { // exchange an existing Supabase session for a Voxely session
  if (!sb) return false;
  const { data } = await sb.auth.getSession();
  const at = data?.session?.access_token; if (!at) return false;
  const r = await fetch(S + '/api/login/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ access_token: at }) }).catch(() => null);
  if (!r || !r.ok) { $('#loginErr').textContent = r ? ((await r.json().catch(() => ({}))).error || 'Login Google gagal') : 'Server tidak bisa dihubungi'; return false; }
  session = await r.json(); localStorage.setItem('voxely', JSON.stringify(session)); return true;
}
if (!sb) $('#googleBtn').style.display = 'none';
$('#googleBtn').onclick = async () => {
  $('#loginErr').textContent = '';
  if (await googleLogin()) { $('#login').classList.remove('on'); renderMe(); route(); refreshBadge(); syncOutfit(); return; }
  sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/' } });
};
$('#yr').textContent = new Date().getFullYear();
(async () => {
  renderMe();
  await refreshMe();                                  // checks the saved session (guest or Google)
  if (!session) await googleLogin();                  // coming back from Google, or server restarted
  renderMe(); route(); refreshBadge(); syncOutfit();
})();
setInterval(refreshBadge, 10000);
</script>
