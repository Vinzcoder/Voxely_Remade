<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Voxely</title>
<style>
  :root { --bg:#04060b; --panel:rgba(5,10,20,.82); --line:#15233f; --blue:#1463ff; --blue2:#0a3fb8; --text:#e6edf7; --dim:#8a97b0; }
  * { box-sizing:border-box; margin:0; border-radius:0; }
  html, body { height:100%; overflow:hidden; background:#000; color:var(--text); font:14px "Segoe UI",Arial,sans-serif; user-select:none; touch-action:none; }
  #c { width:100%; height:100%; display:block; outline:none; }
  .hidden { display:none !important; }
  button { font:inherit; cursor:pointer; }

  /* ---------- HUD ---------- */
  .bar { position:fixed; top:12px; left:12px; display:flex; gap:8px; z-index:5; }
  .hb { position:relative; display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel); border:1px solid var(--line); color:#fff; font-weight:600; backdrop-filter:blur(6px); }
  .hb:hover, .hb.on { background:var(--blue); border-color:var(--blue); }
  .ic { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; }
  #unread { position:absolute; top:-7px; right:-7px; background:#ef4444; color:#fff; font:700 11px/1 "Segoe UI",Arial; min-width:18px; padding:4px 5px; text-align:center; font-style:normal; }
  #unread:empty { display:none; }
  #info { position:fixed; top:12px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); padding:8px 18px; display:flex; gap:14px; align-items:center; z-index:4; backdrop-filter:blur(6px); }
  #info b { color:#fff; } #info span { color:var(--dim); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; background:#22c55e; display:inline-block; }

  /* player list */
  #plist { position:fixed; top:12px; right:12px; width:230px; background:var(--panel); border:1px solid var(--line); z-index:4; backdrop-filter:blur(6px); }
  #plist .ph { display:flex; justify-content:space-between; padding:8px 12px; background:var(--blue2); font-weight:700; letter-spacing:.06em; font-size:12px; }
  #prows { max-height:300px; overflow-y:auto; }
  .pr { display:flex; align-items:center; gap:10px; padding:7px 12px; border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pr i { width:12px; height:12px; flex:none; } .pr.me { background:rgba(20,99,255,.18); font-weight:600; }
  #hudtext { position:fixed; top:60px; left:50%; transform:translateX(-50%); color:#fff; font:700 20px 'Segoe UI',Arial; text-shadow:0 2px 6px #000; z-index:4; pointer-events:none; }
  /* chat */
  #chat { position:fixed; left:12px; bottom:12px; width:380px; background:var(--panel); border:1px solid var(--line); z-index:6; backdrop-filter:blur(6px); }
  #chat .ch { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--blue2); font-weight:700; letter-spacing:.04em; }
  #chat .ch button { background:none; border:0; color:#fff; font-size:16px; }
  #log { height:200px; overflow-y:auto; padding:8px 12px; display:flex; flex-direction:column; gap:3px; user-select:text; }
  #log div, #feed div { word-break:break-word; line-height:1.35; }
  #log b, #feed b { font-weight:700; }
  #msg { width:100%; background:#050913; border:0; border-top:1px solid var(--line); color:#fff; padding:11px 12px; font:inherit; outline:none; }
  #msg:focus { border-top-color:var(--blue); }
  #feed { position:fixed; left:12px; bottom:12px; width:380px; display:flex; flex-direction:column; gap:3px; pointer-events:none; z-index:4; }
  #feed div { background:rgba(4,8,16,.6); padding:4px 10px; text-shadow:0 1px 2px #000; animation:fadeout 7s forwards; }
  @keyframes fadeout { 0%,80% { opacity:1; } 100% { opacity:0; } }

  /* menu / overlays */
  .veil { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:20; backdrop-filter:blur(3px); }
  .card { width:340px; background:#070d1b; border:1px solid var(--blue); padding:22px; }
  .card h2 { font-size:20px; letter-spacing:.1em; margin-bottom:16px; color:#fff; }
  .mb { display:block; width:100%; padding:13px; margin-bottom:8px; background:#0e1a33; border:1px solid var(--line); color:#fff; font-weight:600; text-align:left; }
  .mb:hover { background:var(--blue); border-color:var(--blue); }
  .mb.danger { background:#3a0f16; border-color:#6b1c28; } .mb.danger:hover { background:#c0392b; border-color:#c0392b; }
  .keys { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); color:var(--dim); font-size:12px; line-height:1.7; }
  .keys b { color:#cfe0ff; }
  #toast { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:var(--blue); color:#fff; padding:9px 18px; z-index:30; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on { opacity:1; }

  /* ---------- loading screen ---------- */
  #loader { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 35%, #0c2250 0%, #04060b 70%); transition:opacity .55s; }
  #loader.done { opacity:0; pointer-events:none; }
  .logo { font-size:44px; font-weight:800; letter-spacing:12px; color:#fff; margin-bottom:6px; padding-left:12px; }
  .cubes { display:flex; gap:6px; margin-bottom:26px; } .cubes i { width:12px; height:12px; background:var(--blue); animation:pulse 1s infinite ease-in-out; } .cubes i:nth-child(2) { animation-delay:.15s; } .cubes i:nth-child(3) { animation-delay:.3s; }
  @keyframes pulse { 0%,100% { transform:translateY(0); opacity:.4; } 50% { transform:translateY(-8px); opacity:1; } }
  #ltitle { font-size:20px; color:#cfe0ff; margin-bottom:22px; min-height:26px; }
  #barwrap { width:440px; max-width:80vw; height:10px; background:#0b1428; border:1px solid var(--line); overflow:hidden; position:relative; }
  #bar { height:100%; width:0; background:linear-gradient(90deg,var(--blue2),#3a82ff); transition:width .35s ease-out; position:relative; }
  #bar::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); animation:shine 1.2s infinite; }
  @keyframes shine { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
  #barwrap.err #bar { background:#c0392b; }
  #lrow { width:440px; max-width:80vw; display:flex; justify-content:space-between; margin-top:10px; color:var(--dim); }
  #stat.err { color:#ff6b6b; }
  #tip { position:absolute; bottom:28px; color:var(--dim); font-size:13px; }
  #lclose { display:none; margin-top:20px; padding:10px 28px; background:var(--blue); border:0; color:#fff; font-weight:600; }
  #mobileControls { display:none; position:fixed; inset:0; z-index:8; pointer-events:none; }
  body.mobile #mobileControls { display:block; }
  .touch-zone { position:absolute; pointer-events:auto; touch-action:none; }
  #joystick { left:max(18px, env(safe-area-inset-left)); bottom:max(24px, env(safe-area-inset-bottom)); width:132px; height:132px; border:2px solid rgba(255,255,255,.28); background:rgba(4,8,16,.38); border-radius:50%; }
  #joystick::after { content:""; position:absolute; inset:19px; border:1px solid rgba(255,255,255,.12); border-radius:50%; }
  #stick { position:absolute; left:42px; top:42px; width:46px; height:46px; border-radius:50%; background:rgba(20,99,255,.82); border:2px solid rgba(255,255,255,.65); box-shadow:0 3px 12px rgba(0,0,0,.35); pointer-events:none; }
  #lookHint { right:18px; bottom:24px; color:rgba(255,255,255,.48); font-size:11px; letter-spacing:.04em; text-align:right; pointer-events:none; }
  #jumpTouch { right:max(24px, env(safe-area-inset-right)); bottom:max(40px, env(safe-area-inset-bottom)); width:76px; height:76px; border:2px solid rgba(255,255,255,.6); border-radius:50%; background:rgba(20,99,255,.72); color:#fff; font-weight:800; font-size:12px; pointer-events:auto; touch-action:none; }
  #jumpTouch:active { background:#3a82ff; transform:scale(.96); }
  body.mobile #plist { display:none; }
  body.mobile #info { top:max(8px, env(safe-area-inset-top)); max-width:58vw; overflow:hidden; white-space:nowrap; font-size:12px; padding:7px 10px; }
  body.mobile #info > span:nth-child(2) { display:none; }
  body.mobile .bar { top:max(8px, env(safe-area-inset-top)); left:max(8px, env(safe-area-inset-left)); }
  body.mobile .hb { padding:9px; }
  body.mobile #chat, body.mobile #feed { left:8px; right:8px; width:auto; }
  @media (orientation:portrait) { body.mobile #info { top:52px; left:50%; } body.mobile #joystick { bottom:30px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="bar">
    <button class="hb" id="menuBtn" title="Menu (Esc)"><svg class="ic" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <button class="hb" id="chatBtn" title="Chat (Enter)"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><i id="unread"></i></button>
    <button class="hb on" id="plBtn" title="Player list (Tab)"><svg class="ic" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
  </div>
  <div id="info"><b id="title"></b><span id="srv"></span><span><i class="dot"></i><span id="count">1</span> players</span></div>
  <div id="plist"><div class="ph"><span>PLAYERS</span><b id="pcount">1</b></div><div id="prows"></div></div>
  <div id="hudtext"></div>
  <div id="feed"></div>
  <div id="chat" class="hidden">
    <div class="ch"><span>CHAT</span><button id="chatX" title="Tutup (Esc)">✕</button></div>
    <div id="log"></div>
    <input id="msg" maxlength="140" placeholder="Ketik pesan lalu tekan Enter…" autocomplete="off">
  </div>
</div>

<div id="menu" class="veil hidden"><div class="card">
  <h2>MENU</h2>
  <button class="mb" id="resume">▶ &nbsp;Lanjutkan</button>
  <button class="mb" id="reset">↺ &nbsp;Reset Character</button>
  <button class="mb danger" id="leave">Leave Game</button>
  <div class="keys"><b>W A S D</b> bergerak · <b>Space</b> lompat<br><b>Drag mouse</b> putar kamera · <b>Scroll</b> zoom<br><b>Enter</b> chat · <b>Esc</b> menu · <b>Tab</b> daftar pemain<br><b>/e wave</b> · <b>/e dance</b> emote<br><b>W</b> di depan tangga = memanjat</div>
</div></div>

<div id="dc" class="veil hidden"><div class="card">
  <h2>TERPUTUS</h2><p style="color:var(--dim);margin-bottom:16px">Koneksi ke server terputus.</p>
  <button class="mb danger" onclick="window.close()">Keluar</button>
</div></div>

<div id="toast"></div>
<div id="mobileControls" aria-label="Kontrol sentuh">
  <div id="joystick" class="touch-zone" aria-label="Joystick gerak"><div id="stick"></div></div>
  <div id="lookHint">GESER UNTUK<br>PUTAR KAMERA</div>
  <button id="jumpTouch" type="button" aria-label="Lompat">LOMPAT</button>
</div>

<div id="loader">
  <div class="logo">VOXELY</div>
  <div class="cubes"><i></i><i></i><i></i></div>
  <div id="ltitle"></div>
  <div id="barwrap"><div id="bar"></div></div>
  <div id="lrow"><span id="stat">Menyiapkan…</span><span id="pct">0%</span></div>
  <button id="lclose">Tutup</button>
  <div id="tip"></div>
</div>

<script src="vendor/babylon.js"></script>
<script src="vendor/socket.io.min.js"></script>
<script>
const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const t0 = performance.now();
let started = false, menuOpen = false, chatOpen = false, unread = 0;

/* ---------- loading screen ---------- */
const TIPS = ['Tekan Enter untuk membuka chat.', 'Tekan Esc untuk membuka menu.', 'Drag mouse untuk memutar kamera.', 'Jatuh? Pakai Reset Character di menu.', 'Scroll untuk zoom in dan zoom out.'];
$('tip').textContent = 'Tips: ' + TIPS[Math.floor(Math.random() * TIPS.length)];
$('ltitle').textContent = 'Memuat game…';
let prog = 0;
function setProg(p, text) {
  prog = Math.max(prog, p); $('bar').style.width = prog + '%'; $('pct').textContent = Math.floor(prog) + '%';
  if (text) $('stat').textContent = text;
}
function loadError(msg) {
  $('stat').textContent = msg; $('stat').classList.add('err'); $('barwrap').classList.add('err'); $('lclose').style.display = 'block';
}
$('lclose').onclick = () => window.close();
setProg(8, 'Menyiapkan engine…');

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------- network ---------- */
const TEST = q.get('test') === '1'; // opened inside Voxely Studio: no network, the world comes from the editor
function fakeSocket() {
  const h = {}, k = { id: 'local', on(e, f) { (h[e] = h[e] || []).push(f); }, fire(e, d) { (h[e] || []).forEach(f => f(d)); }, volatile: { emit() {} },
    emit(e, a) { if (e === 'chat') k.fire('chat', { id: 'local', name: me ? me.name : 'You', color: '#1463ff', text: a }); } };
  return k;
}
const socket = TEST ? fakeSocket() : io(q.get('server'), { auth: { token: q.get('token') }, reconnection: false });
socket.on('connect_error', e => loadError('Tidak bisa terhubung: ' + e.message + ' (login ulang di website)'));
socket.on('connect', () => { setProg(25, 'Terhubung ke server…'); socket.emit('join', { game: q.get('game'), room: q.get('room') || '' }); });
socket.on('disconnect', () => { if (started) $('dc').classList.remove('hidden'); else loadError('Koneksi terputus'); });
if (TEST) {
  addEventListener('message', e => {
    const m = e.data;
    if (m && m.type === 'load') socket.fire('init', { me: { id: 'local', name: m.name || 'Player', color: '#1463ff', outfit: m.outfit || null }, room: 'TEST', game: m.game, players: [], now: Date.now(), start: Date.now() });
  });
  parent.postMessage({ type: 'ready' }, '*');
}

/* ---------- engine ---------- */
let engine, scene, cam, camTarget;
try {
  engine = new BABYLON.Engine($('c'), true);
  scene = new BABYLON.Scene(engine);
} catch (e) { loadError('Gagal memulai grafis: ' + e.message); throw e; }
const c3 = h => BABYLON.Color3.FromHexString(h);
const mat = hex => { const m = new BABYLON.StandardMaterial('m', scene); m.diffuseColor = c3(hex); m.specularColor = BABYLON.Color3.Black(); return m; };

new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0.3, 1, 0.2), scene).intensity = 0.75;
new BABYLON.DirectionalLight('d', new BABYLON.Vector3(-0.4, -1, -0.3), scene).intensity = 0.45;
camTarget = BABYLON.MeshBuilder.CreateBox('ct', { size: 0.01 }, scene); camTarget.isVisible = false;
cam = new BABYLON.ArcRotateCamera('cam', -Math.PI / 2, 1.1, 12, camTarget, scene);
cam.lockedTarget = camTarget; cam.lowerRadiusLimit = 4; cam.upperRadiusLimit = 25;
cam.lowerBetaLimit = 0.2; cam.upperBetaLimit = 1.5; cam.panningSensibility = 0;
cam.inputs.removeByType('ArcRotateCameraKeyboardMoveInput');
cam.attachControl($('c'), true);
const mobileDevice = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
if (mobileDevice) { document.body.classList.add('mobile'); cam.detachControl(); }
setProg(15, 'Menunggu server…');

/* ---------- R6-style character (customizable outfit) ---------- */
const S = 0.34; // one "stud"
const OUT0 = { skin: { head: '#e6eaf2', torso: '#e6eaf2', armL: '#e6eaf2', armR: '#e6eaf2', legL: '#e6eaf2', legR: '#e6eaf2' }, face: 'smile', hat: 'none', hatColor: '#e63946' };
const matCache = {}, headCache = {};
const mat2 = hex => matCache[hex] || (matCache[hex] = mat(hex));
// face drawn relative to the head centre (cx, cy); h = head height in px
function drawFace(g, face, cx, cy, h) {
  g.fillStyle = g.strokeStyle = '#111'; g.lineCap = 'round';
  const eye = (x, y, rx, ry) => { g.beginPath(); g.ellipse(cx + x * h, cy + y * h, rx * h, ry * h, 0, 0, Math.PI * 2); g.fill(); };
  const arc = (x, y, r, a, b, w) => { g.lineWidth = w * h; g.beginPath(); g.arc(cx + x * h, cy + y * h, r * h, a * Math.PI, b * Math.PI); g.stroke(); };
  const line = (x1, y1, x2, y2, w) => { g.lineWidth = w * h; g.beginPath(); g.moveTo(cx + x1 * h, cy + y1 * h); g.lineTo(cx + x2 * h, cy + y2 * h); g.stroke(); };
  if (face === 'cool') { g.fillRect(cx - 0.27 * h, cy - 0.15 * h, 0.54 * h, 0.11 * h); line(-0.27, -0.12, -0.34, -0.15, 0.03); line(0.27, -0.12, 0.34, -0.15, 0.03); arc(0, -0.055, 0.19, 0.17, 0.83, 0.031); }
  else if (face === 'wink') { eye(-0.137, -0.083, 0.031, 0.058); line(0.09, -0.08, 0.185, -0.08, 0.03); arc(0, -0.055, 0.19, 0.17, 0.83, 0.031); }
  else if (face === 'surprised') { eye(-0.137, -0.083, 0.04, 0.07); eye(0.137, -0.083, 0.04, 0.07); g.beginPath(); g.ellipse(cx, cy + 0.14 * h, 0.05 * h, 0.07 * h, 0, 0, Math.PI * 2); g.fill(); }
  else if (face === 'sad') { eye(-0.137, -0.083, 0.031, 0.058); eye(0.137, -0.083, 0.031, 0.058); arc(0, 0.24, 0.17, 1.17, 1.83, 0.031); }
  else if (face === 'angry') { eye(-0.137, -0.06, 0.028, 0.045); eye(0.137, -0.06, 0.028, 0.045); line(-0.21, -0.17, -0.07, -0.11, 0.035); line(0.07, -0.11, 0.21, -0.17, 0.035); arc(0, 0.2, 0.12, 1.2, 1.8, 0.03); }
  else { eye(-0.137, -0.083, 0.031, 0.058); eye(0.137, -0.083, 0.031, 0.058); arc(0, -0.055, 0.19, 0.17, 0.83, 0.031); }
}
function headMat(color, face) {
  const key = color + '|' + face; if (headCache[key]) return headCache[key];
  const W = 1024, H = 292, dt = new BABYLON.DynamicTexture('face', { width: W, height: H }, scene, true); // front of the cylinder = u 0.75
  const g = dt.getContext(); g.fillStyle = color; g.fillRect(0, 0, W, H); drawFace(g, face, W * 0.75, H / 2, H); dt.update();
  const m = new BABYLON.StandardMaterial('head', scene); m.diffuseTexture = dt; m.specularColor = BABYLON.Color3.Black();
  return (headCache[key] = m);
}
function addHat(body, o) {
  if (!o.hat || o.hat === 'none') return;
  const m = mat2(o.hatColor || '#e63946'), T = 5.3; // head top, in studs
  const add = mesh => { mesh.parent = body; mesh.material = m; return mesh; };
  const cyl = (d, h, x, y, z, dTop) => { const c = add(BABYLON.MeshBuilder.CreateCylinder('hat', { diameter: d * S, diameterTop: dTop === undefined ? undefined : dTop * S, height: h * S, tessellation: 24 }, scene)); c.position.set(x * S, y * S, z * S); return c; };
  const bx = (w, h, d, x, y, z) => { const c = add(BABYLON.MeshBuilder.CreateBox('hat', { width: w * S, height: h * S, depth: d * S }, scene)); c.position.set(x * S, y * S, z * S); return c; };
  if (o.hat === 'cap') { cyl(1.6, 0.5, 0, T + 0.1, 0); bx(1.2, 0.1, 0.8, 0, T - 0.1, 0.95); }
  else if (o.hat === 'tophat') { cyl(2.1, 0.12, 0, T + 0.04, 0); cyl(1.35, 1.5, 0, T + 0.8, 0); }
  else if (o.hat === 'crown') { cyl(1.5, 0.45, 0, T + 0.18, 0); for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; cyl(0.34, 0.45, Math.cos(a) * 0.6, T + 0.63, Math.sin(a) * 0.6, 0); } }
  else if (o.hat === 'headphones') { bx(1.85, 0.14, 0.3, 0, T + 0.1, 0); [-1, 1].forEach(s => { bx(0.14, 1.2, 0.3, s * 0.88, 4.75, 0); cyl(0.62, 0.32, s * 0.98, 4.65, 0).rotation.z = Math.PI / 2; }); }
  else if (o.hat === 'horns') { [-1, 1].forEach(s => { cyl(0.4, 0.9, s * 0.45, T + 0.35, 0, 0).rotation.z = -s * 0.45; }); }
}
function makeChar(p) {
  const o = p.outfit || OUT0, sk = o.skin || OUT0.skin;
  const root = new BABYLON.TransformNode('p', scene), body = new BABYLON.TransformNode('b', scene); body.parent = root;
  const box = (w, h, d, x, y, hex) => { const m = BABYLON.MeshBuilder.CreateBox('part', { width: w * S, height: h * S, depth: d * S }, scene); m.parent = body; m.position.set(x * S, y * S, 0); m.material = mat2(hex); return m; };
  const legL = box(1, 2, 1, -0.5, 1, sk.legL), legR = box(1, 2, 1, 0.5, 1, sk.legR);
  box(2, 2, 1, 0, 3, sk.torso);
  const armL = box(1, 2, 1, -1.5, 3, sk.armL), armR = box(1, 2, 1, 1.5, 3, sk.armR);
  [legL, legR, armL, armR].forEach(m => m.setPivotPoint(new BABYLON.Vector3(0, S, 0))); // rotate from hip / shoulder
  const head = BABYLON.MeshBuilder.CreateCylinder('head', { diameter: 1.45 * S, height: 1.3 * S, tessellation: 40,

  d.players.filter(p => p.id !== me.id).forEach(addOther);
  setProg(96, 'Hampir siap…');
  scene.executeWhenReady(() => {
    setProg(100, 'Siap!');
    setTimeout(startGame, Math.max(400, 1600 - (performance.now() - t0))); // show the loader at least ~1.6s
  });
}
function startGame() {
  started = true; $('loader').classList.add('done'); $('hud').classList.remove('hidden');
  setTimeout(() => $('loader').remove(), 700); setTimeout(() => toast('Tekan Esc untuk menu · Enter untuk chat'), 900);
}
function addOther(p) { others.set(p.id, { ch: makeChar(p), t: p }); }
socket.on('join', p => { addOther(p); plist.set(p.id, p); renderPlayers(); addSystem(p.name + ' bergabung'); });
socket.on('leave', id => { const o = others.get(id); if (o) { killChar(o.ch); others.delete(id); } plist.delete(id); renderPlayers(); });
socket.on('move', p => { const o = others.get(p.id); if (o) o.t = p; });
socket.on('count', n => ($('count').textContent = n));

/* ---------- menu ---------- */
let leaveArm = false;
function resetLeave() { leaveArm = false; $('leave').textContent = 'Leave Game'; }
function setMenu(v) {
  menuOpen = v; $('menu').classList.toggle('hidden', !v); $('menuBtn').classList.toggle('on', v);
  if (v) { setChat(false); resetLeave(); Object.keys(keys).forEach(k => (keys[k] = false)); }
}
$('menuBtn').onclick = () => setMenu(!menuOpen);
$('resume').onclick = () => setMenu(false);
$('reset').onclick = () => { respawn(true); setMenu(false); toast('Karakter di-reset'); };
$('leave').onclick = () => {
  if (!leaveArm) { leaveArm = true; $('leave').textContent = 'Yakin? Klik lagi untuk keluar'; return; }
  if (TEST) { parent.postMessage({ type: 'stop' }, '*'); return; }
  window.close();
};
$('menu').onclick = e => { if (e.target === $('menu')) setMenu(false); };

/* ---------- chat ---------- */
const typing = () => document.activeElement === $('msg');
function updUnread() { $('unread').textContent = unread > 0 ? (unread > 9 ? '9+' : unread) : ''; }
function setChat(v) {
  chatOpen = v; $('chat').classList.toggle('hidden', !v); $('feed').classList.toggle('hidden', v); $('chatBtn').classList.toggle('on', v);
  if (v) { unread = 0; updUnread(); $('log').scrollTop = 1e9; $('msg').focus(); } else $('msg').blur();
}
$('chatBtn').onclick = () => { if (menuOpen) setMenu(false); setChat(!chatOpen); };
$('chatX').onclick = () => setChat(false);
function line(name, color, text) {
  const d = document.createElement('div');
  if (name) { const b = document.createElement('b'); b.textContent = name + ': '; b.style.color = color; d.append(b); }
  d.append(text); return d;
}
function pushMsg(name, color, text, system) {
  const el = line(name, color, text); if (system) el.style.color = '#8a97b0';
  const log = $('log'); log.append(el); while (log.children.length > 60) log.firstChild.remove();
  log.scrollTop = 1e9;
  if (!chatOpen) {
    const f = line(name, color, text); if (system) f.style.color = '#b6c2d9';
    $('feed').append(f); while ($('feed').children.length > 4) $('feed').firstChild.remove();
    setTimeout(() => f.remove(), 7000);
    if (!system) { unread++; updUnread(); }
  }
}
const addSystem = t => pushMsg('', '', t, true);
let emote = null; // { e: 'wave' | 'dance', t: seconds }
function doEmote(n) {
  n = String(n).trim().toLowerCase();
  if (n === 'wave' || n === 'dance') { emote = { e: n, t: 0 }; socket.emit('emote', n); toast('/e ' + n + ' — gerak untuk berhenti'); }
  else addSystem('Emote tidak dikenal. Coba: /e wave atau /e dance');
}
socket.on('emote', m => { const o = others.get(m.id); if (o) o.emote = m.e === 'stop' ? null : { e: m.e, t: 0 }; });
socket.on('chat', m => {
  pushMsg(m.name, m.color, m.text, false);
  const ch = m.id === socket.id ? myChar : others.get(m.id)?.ch; if (ch) showBubble(ch, m.text);
});
function sendMsg() {
  const t = $('msg').value.trim();
  if (!t) return setChat(false);
  const m = /^\/(?:e|emote)\b\s*(.*)$/i.exec(t);
  if (m) { $('msg').value = ''; setChat(false); doEmote(m[1]); return; }
  socket.emit('chat', t); $('msg').value = '';
}

/* ---------- input ---------- */
const keys = {};
const touchState = { x: 0, y: 0, jump: false, joyId: null, lookId: null, lookX: 0, lookY: 0 };
const joy = $('joystick'), stick = $('stick'), jumpTouch = $('jumpTouch');
function resetJoystick() { touchState.x = touchState.y = 0; touchState.joyId = null; stick.style.transform = 'translate(0, 0)'; }
function updateJoystick(e) {
  const r = joy.getBoundingClientRect(), max = 43;
  let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(x, y); if (len > max) { x *= max / len; y *= max / len; }
  touchState.x = x / max; touchState.y = -y / max; stick.style.transform = `translate(${x}px, ${y}px)`;
}
joy.addEventListener('pointerdown', e => { e.preventDefault(); touchState.joyId = e.pointerId; joy.setPointerCapture(e.pointerId); updateJoystick(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === touchState.joyId) { e.preventDefault(); updateJoystick(e); } });
joy.addEventListener('pointerup', e => { if (e.pointerId === touchState.joyId) resetJoystick(); });
joy.addEventListener('pointercancel', resetJoystick);
jumpTouch.addEventListener('pointerdown', e => { e.preventDefault(); touchState.jump = true; jumpTouch.setPointerCapture(e.pointerId); });
jumpTouch.addEventListener('pointerup', e => { e.preventDefault(); touchState.jump = false; });
jumpTouch.addEventListener('pointercancel', () => (touchState.jump = false));
$('c').addEventListener('pointerdown', e => {
  if (typing()) $('msg').blur();
  if (!mobileDevice || e.clientX < innerWidth * .34 || e.pointerType === 'mouse') return;
  touchState.lookId = e.pointerId; touchState.lookX = e.clientX; touchState.lookY = e.clientY; $('c').setPointerCapture(e.pointerId);
});
$('c').addEventListener('pointermove', e => {
  if (e.pointerId !== touchState.lookId) return;
  const dx = e.clientX - touchState.lookX, dy = e.clientY - touchState.lookY;
  touchState.lookX = e.clientX; touchState.lookY = e.clientY;
  cam.alpha -= dx * 0.012; cam.beta = Math.max(cam.lowerBetaLimit, Math.min(cam.upperBetaLimit, cam.beta + dy * 0.009));
});
$('c').addEventListener('pointerup', e => { if (e.pointerId === touchState.lookId) touchState.lookId = null; });
$('c').addEventListener('pointercancel', e => { if (e.pointerId === touchState.lookId) touchState.lookId = null; });
addEventListener('keydown', e => {
  if (!started) return;
  if (e.key === 'Tab') { e.preventDefault(); togglePlayers(); return; }
  if (e.key === 'Escape') { chatOpen ? setChat(false) : setMenu(!menuOpen); return; }
  if (typing()) { if (e.key === 'Enter') sendMsg(); return; }
  if (menuOpen) return;
  if (e.key === 'Enter') { e.preventDefault(); setChat(true); return; }
  keys[e.code] = true;
});
addEventListener('keyup', e => (keys[e.code] = false));
addEventListener('blur', () => Object.keys(keys).forEach(k => (keys[k] = false)));
$('c').addEventListener('pointerdown', () => { if (typing()) $('msg').blur(); });

/* ---------- game loop ---------- */
let t = 0, sendAcc = 0, air = 0, climbing = false, ladderRef = null, climbCool = 0;
const push = { t: 0, x: 0, z: 0 };
scene.onBeforeRenderObservable.add(() => {
  if (!myChar) return;
  const dt = Math.min(engine.getDeltaTime() / 1000, 0.05); t += dt;
  const on = started && !menuOpen && !typing();
  const fx = -Math.cos(cam.alpha), fz = -Math.sin(cam.alpha), rx = fz, rz = -fx;
  const ix = on ? (Math.abs(touchState.x) > 0.08 ? touchState.x : (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0)) : 0;
  const iz = on ? (Math.abs(touchState.y) > 0.08 ? touchState.y : (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0)) : 0;
  const moveUp = on && (touchState.y > 0.18 || keys.KeyW), moveDown = on && (touchState.y < -0.18 || keys.KeyS);
  let dx = fx * iz + rx * ix, dz = fz * iz + rz * ix; const len = Math.hypot(dx, dz);
  if (len > 0) { dx /= len; dz /= len; }
  if (standOn && grounded) { pos.x += standOn.ddx; pos.y += standOn.ddy; pos.z += standOn.ddz; } // ride moving platforms
  for (const p of moved) { p.ddx = p.ddy = p.ddz = 0; p.mv = false; } moved.length = 0;

  // grab a ladder: walk into it and hold W / S
  climbCool = Math.max(0, climbCool - dt);
  if (!climbing && climbCool === 0 && (moveUp || moveDown)) {
    const l = ladders.find(b => overlap(b, 0.25)); if (l) { climbing = true; ladderRef = l; }
  }
  let climbDir = 0;
  if (climbing) {
    const l = ladderRef, top = l.y + l.h / 2, bottom = l.y - l.h / 2, lx = l.x - pos.x, lz = l.z - pos.z, ln = Math.hypot(lx, lz) || 1;
    climbDir = moveUp ? 1 : moveDown ? -1 : 0;
    vy = 0; dx = dz = 0; grounded = false; ry = Math.atan2(lx, lz);
    moveAxis('y', climbDir * 5 * dt);
    if (on && (keys.Space || touchState.jump)) { climbing = false; climbCool = 0.4; vy = 9; push.t = 0.3; push.x = -lx / ln * 4; push.z = -lz / ln * 4; }      // jump off
    else if (!overlap(l, 0.4)) climbing = false;                                                                                           // slipped off
    else if (climbDir > 0 && pos.y >= top - 0.6) { climbing = false; climbCool = 0.5; vy = 7.5; push.t = 0.5; push.x = lx / ln * 4; push.z = lz / ln * 4; } // hop over the top
    else if (climbDir < 0 && pos.y <= bottom + 0.05) { climbing = false; climbCool = 0.2; }                                                // step off at the bottom
  } else {
    if (grounded && on && (keys.Space || touchState.jump)) vy = jumpPower;
    vy -= 30 * dt; grounded = false;
    let vx = dx * walkSpeed, vz = dz * walkSpeed;
    if (push.t > 0) { push.t -= dt; vx += push.x; vz += push.z; }
    moveAxis('x', vx * dt); moveAxis('z', vz * dt); moveAxis('y', vy * dt);
    if (len > 0) ry = Math.atan2(dx, dz);
  }
  if (pos.y < -30) respawn(false);
  if (!grounded) standOn = null;
  checkParts(dt);

  if (grounded) air = 0; else air += dt;
  const moving = len > 0 && !climbing;
  const st = climbing ? 4 : air > 0.12 ? (vy > 1 ? 2 : 3) : moving ? 1 : 0;
  let em = null;
  if (emote) { emote.t += dt; if (st !== 0 || (emote.e === 'wave' ? emote.t > 2.4 : emote.t > 30)) { emote = null; socket.emit('emote', 'stop'); } else em = emote.e; }
  myChar.root.position.set(pos.x, pos.y, pos.z); myChar.body.rotation.y = ry; pose(myChar, st, dt, climbDir !== 0, em); bubbleTick(myChar, dt);
  camTarget.position.set(pos.x, pos.y + 1.4, pos.z);

  sendAcc += dt; if (sendAcc > 0.066) { sendAcc = 0; socket.volatile.emit('move', { x: pos.x, y: pos.y, z: pos.z, ry, st }); }
  others.forEach(o => {
    const r = o.ch.root.position, k = Math.min(1, dt * 12), py = r.y;
    r.x += (o.t.x - r.x) * k; r.y += (o.t.y - r.y) * k; r.z += (o.t.z - r.z) * k;
    const sts = o.t.st || 0; let em = null;
    if (o.emote) { o.emote.t += dt; if (sts !== 0 || (o.emote.e === 'wave' ? o.emote.t > 2.4 : o.emote.t > 30)) o.emote = null; else em = o.emote.e; }
    o.ch.body.rotation.y = o.t.ry; pose(o.ch, sts, dt, Math.abs(r.y - py) > 0.003, em); bubbleTick(o.ch, dt);
  });
});
engine.runRenderLoop(() => scene.render());
addEventListener('resize', () => engine.resize());
</script>
